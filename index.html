<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#F3F5F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151C23" media="(prefers-color-scheme: dark)">
<title>読書ノート</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --paper:#F3F5F4; --surface:#FFFFFF; --ink:#1F2A36; --muted:#5F6D79; --rule:#D5DEE3;
  --stamp:#5E4A9B; --danger:#B3261E; --sun:#B83A3A; --sat:#2F5E9E; --hl:#ECE8F6; --star:#B7791F;
  /* 日本語はスマホ標準のフォントで表示（Claudeのアプリと同じ見え方） */
  --font:system-ui,-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic UI",Meiryo,sans-serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root{ --paper:#151C23; --surface:#1D2630; --ink:#E3E9ED; --muted:#9CAAB5; --rule:#2F3C48; --stamp:#B9A6EE; --danger:#F4A79F; --sun:#F29A9A; --sat:#95B8F2; --hl:#2B2942; --star:#F2C24E; }
}
*,*::before,*::after{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }
body{ margin:0; background:var(--paper); color:var(--ink); font:16px/1.6 var(--font); -webkit-tap-highlight-color:transparent; }
body.scanning{ background:#000; }
body.modal-open{ overflow:hidden; }
#app{ max-width:560px; margin:0 auto; min-height:100vh; padding-top:env(safe-area-inset-top,0px); padding-bottom:calc(96px + env(safe-area-inset-bottom,0px)); }
p{ margin:0; }
button,input{ font:inherit; color:inherit; }
button{ cursor:pointer; }
:focus-visible{ outline:3px solid var(--stamp); outline-offset:2px; border-radius:6px; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
[hidden]{ display:none !important; }
svg.i{ width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none; display:block; }

/* ホーム */
.top{ display:flex; align-items:center; gap:12px; padding:14px 10px 6px 20px; min-height:62px; }
.brand{ font-weight:700; font-size:24px; letter-spacing:.02em; margin:0; }
.today{ margin-left:auto; color:var(--muted); font-size:13.5px; white-space:nowrap; }
.today b{ color:var(--ink); font-size:17px; margin:0 2px; font-variant-numeric:tabular-nums; }
.selbtn{ background:none; border:0; color:var(--stamp); font-weight:700; font-size:15px; padding:10px; border-radius:8px; }
.selcount{ margin-left:auto; margin-right:10px; font-weight:700; font-size:15px; }
.shelfhead{ position:sticky; top:0; z-index:2; background:var(--paper); }
.tabs{ display:flex; border-bottom:1px solid var(--rule); padding:0 4px; overflow-x:auto; scrollbar-width:none; }
.tabs::-webkit-scrollbar{ display:none; }
.tabs button{ flex:1 0 auto; background:none; border:0; padding:12px 3px 11px; color:var(--muted); font-size:14px; border-radius:0; white-space:nowrap; }
.tabs button[aria-selected="true"]{ color:var(--ink); font-weight:700; box-shadow:inset 0 -2px 0 var(--stamp); }
.count{ font-size:11.5px; margin-left:3px; font-variant-numeric:tabular-nums; }
.tools{ display:flex; align-items:center; gap:6px; min-height:50px; padding:6px 4px 6px 12px; border-bottom:1px solid var(--rule); }
.chips{ display:flex; align-items:center; gap:6px; flex:1; min-width:0; overflow-x:auto; scrollbar-width:none; padding:2px 0; }
.chips::-webkit-scrollbar{ display:none; }
.chips > .i{ width:18px; height:18px; color:var(--muted); }
.chips.wrap{ flex-wrap:wrap; overflow:visible; margin-top:8px; }
.chip{ flex:none; display:inline-flex; align-items:center; gap:4px; min-height:34px; padding:0 12px; border:1.5px solid var(--rule); border-radius:999px; background:var(--surface); color:var(--ink); font-size:13.5px; white-space:nowrap; }
.chip[aria-pressed="true"], .chip.on{ background:var(--ink); border-color:var(--ink); color:var(--paper); font-weight:700; }
.chip .i{ width:15px; height:15px; stroke-width:2.4; }
.chip.on{ padding-right:4px; }
.chip .x{ display:grid; place-items:center; width:28px; height:28px; padding:0; background:none; border:0; border-radius:50%; color:inherit; }
.chip.add{ color:var(--muted); border-style:dashed; }
.shown{ flex:1; color:var(--muted); font-size:13.5px; }
.sortbtn{ flex:none; margin-left:auto; display:inline-flex; align-items:center; gap:4px; min-height:40px; padding:0 8px; background:none; border:0; color:var(--ink); font-size:13.5px; font-weight:700; border-radius:8px; white-space:nowrap; }
.sortbtn .i{ width:18px; height:18px; }
.shelf{ list-style:none; margin:0; padding:0; }
.shelf li{ position:relative; }
.shelf li + li{ border-top:1px solid var(--rule); }
.rowbtn{ display:flex; gap:14px; width:100%; padding:14px 52px 14px 20px; background:none; border:0; text-align:left; align-items:flex-start; border-radius:0; }
.rowbtn:active{ background:var(--surface); }
.selecting .rowbtn{ padding-right:20px; }
.shelf li.sel .rowbtn{ background:var(--hl); }
.info{ position:absolute; top:8px; right:6px; width:44px; height:44px; display:grid; place-items:center; background:none; border:0; color:var(--muted); border-radius:50%; }
.info .i{ width:22px; height:22px; }
.check{ flex:none; width:24px; height:24px; border-radius:50%; border:2px solid var(--rule); align-self:center; display:grid; place-items:center; color:transparent; }
.check .i{ width:16px; height:16px; stroke-width:3; }
.sel .check{ background:var(--stamp); border-color:var(--stamp); color:var(--surface); }
.rowbody{ display:block; flex:1; min-width:0; }
.title{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; font-weight:700; font-size:16.5px; line-height:1.45; }
.author{ display:block; color:var(--muted); font-size:13.5px; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tag{ display:inline-block; font-size:12px; color:var(--stamp); border:1px solid currentColor; border-radius:4px; padding:0 6px; }
.meta{ display:flex; flex-wrap:wrap; align-items:center; gap:4px 6px; margin-top:6px; }
.ttag{ font-size:12px; color:var(--muted); background:var(--surface); border:1px solid var(--rule); border-radius:4px; padding:0 6px; }
.stars{ color:var(--star); font-size:12.5px; letter-spacing:1px; line-height:1; }
.stars .off{ color:var(--rule); }
.favmark{ color:var(--star); margin-right:4px; }
.prog{ display:block; margin-top:8px; }
.bar{ display:block; height:4px; background:var(--rule); border-radius:2px; overflow:hidden; }
.bar i{ display:block; height:100%; background:var(--ink); border-radius:2px; }
.progtext{ display:flex; flex-wrap:wrap; gap:0 12px; font-size:12.5px; color:var(--muted); margin-top:5px; font-variant-numeric:tabular-nums; }
.empty{ padding:48px 24px; }
.empty p{ color:var(--muted); }
.empty .etitle{ font-size:19px; font-weight:700; color:var(--ink); margin-bottom:8px; }
.empty p + p{ margin-top:6px; }

/* 下のバー */
.nav{ position:fixed; left:0; right:0; bottom:0; z-index:5; background:var(--surface); border-top:1px solid var(--rule); padding-bottom:env(safe-area-inset-bottom,0px); }
.nav .in{ max-width:560px; margin:0 auto; display:grid; grid-template-columns:repeat(5,1fr); }
.nav button{ display:flex; flex-direction:column; align-items:center; gap:3px; padding:8px 0 10px; background:none; border:0; color:var(--muted); font-size:11.5px; border-radius:0; }
.nav .ic{ display:grid; place-items:center; width:60px; height:30px; border-radius:15px; }
.nav button[aria-current="page"]{ color:var(--ink); font-weight:700; }
.nav button[aria-current="page"] .ic{ background:var(--hl); }
.nav button[aria-current="page"] .i{ stroke-width:2.2; }
.selbar{ position:fixed; left:0; right:0; bottom:0; z-index:6; background:var(--surface); border-top:1px solid var(--rule); padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px)); }
.selbar .in{ max-width:560px; margin:0 auto; display:grid; gap:8px; }
.selbar.c2 .in{ grid-template-columns:1fr 1fr; }
.selbar.c3 .in{ grid-template-columns:repeat(6,1fr); }
.selbar.c3 .mv{ grid-column:span 2; }
.selbar.c3 .ft{ grid-column:span 3; }
.selbar .btn{ min-height:44px; font-size:14px; padding:0 6px; }

/* ボタン・入力 */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:48px; padding:0 18px; border-radius:12px; border:1.5px solid var(--ink); background:transparent; color:var(--ink); font-size:15px; font-weight:700; text-decoration:none; text-align:center; line-height:1.3; }
.btn.primary{ background:var(--ink); color:var(--paper); }
.btn.block{ display:flex; width:100%; margin-top:16px; }
.btn.danger{ color:var(--danger); border-color:var(--danger); }
.btn.light{ border-color:rgba(255,255,255,.85); color:#fff; background:rgba(0,0,0,.25); }
.btn:disabled{ opacity:.35; cursor:default; }
.btn:not(:disabled):active{ transform:translateY(1px); }
.linkbtn{ background:none; border:0; padding:0 2px; color:var(--stamp); text-decoration:underline; font-size:inherit; }
.field{ display:block; margin-top:14px; }
.field > span{ display:block; font-size:13px; color:var(--muted); margin-bottom:6px; }
.field input, .inline input{ width:100%; min-height:48px; padding:10px 12px; border:1.5px solid var(--rule); border-radius:10px; background:var(--surface); font-size:16px; }
input:focus{ border-color:var(--ink); outline:none; }
input:focus-visible{ outline:none; box-shadow:0 0 0 3px color-mix(in srgb, var(--stamp) 30%, transparent); }
.inline{ display:flex; gap:8px; }
.inline input{ flex:1; min-width:0; }
.inline .btn{ flex:none; }
.seg{ border:0; padding:0; margin:16px 0 0; min-width:0; }
.seg legend{ font-size:13px; color:var(--muted); margin-bottom:6px; padding:0; }
.seg .opts{ display:grid; grid-auto-flow:column; grid-auto-columns:1fr; background:var(--paper); border:1.5px solid var(--rule); border-radius:12px; padding:3px; gap:3px; }
.seg label{ position:relative; display:block; }
.seg input{ position:absolute; inset:0; width:100%; height:100%; opacity:0; margin:0; cursor:pointer; }
.seg span{ display:block; text-align:center; padding:9px 4px; border-radius:9px; font-size:14.5px; color:var(--muted); }
.seg input:checked + span{ background:var(--ink); color:var(--paper); font-weight:700; }
.seg input:focus-visible + span{ outline:3px solid var(--stamp); outline-offset:1px; }
.numrow{ display:flex; align-items:baseline; gap:10px; margin-top:14px; }
.numrow input{ flex:1; min-width:0; min-height:60px; padding:6px 12px; border:1.5px solid var(--rule); border-radius:10px; background:var(--paper); font-size:32px; font-weight:700; font-variant-numeric:tabular-nums; }
input[type=number]{ -moz-appearance:textfield; appearance:textfield; }
input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button{ -webkit-appearance:none; margin:0; }
.unit{ flex:none; color:var(--muted); font-size:15px; }
.hint{ font-size:13.5px; color:var(--muted); margin-top:8px; min-height:1.6em; }
.hint.bad{ color:var(--danger); }

/* 表紙 */
.cover{ flex:none; display:block; background:var(--rule); border-radius:2px 5px 5px 2px; box-shadow:0 1px 2px rgba(15,25,35,.22), inset 3px 0 0 rgba(0,0,0,.14); }
.cover.xs{ width:36px; height:52px; }
.cover.sm{ width:48px; height:70px; }
.cover.lg{ width:128px; height:186px; box-shadow:0 6px 18px rgba(15,25,35,.22), inset 4px 0 0 rgba(0,0,0,.14); }
.ph{ background:var(--c); color:#F5F2EA; writing-mode:vertical-rl; overflow:hidden; line-height:1.3; letter-spacing:.06em; font-weight:700; }
.ph span{ display:block; max-height:100%; overflow:hidden; }
.cover.xs.ph{ font-size:8px; padding:4px 3px; }
.cover.sm.ph{ font-size:10px; padding:5px 4px 5px 3px; }
.cover.lg.ph{ font-size:17px; padding:14px 10px 14px 8px; }
.cover.xxs{ width:22px; height:32px; border-radius:1px 3px 3px 1px; }
.cover.xxs.ph{ font-size:0; padding:0; }
.cover.fill{ width:100%; height:auto; aspect-ratio:128/186; }
.cover.fill.ph{ font-size:11px; padding:8px 6px 8px 5px; }

/* ページ共通 */
.pagebar{ display:flex; align-items:center; gap:4px; padding:8px 8px 0; min-height:52px; }
.back{ display:inline-flex; align-items:center; gap:2px; background:none; border:0; padding:10px 12px 10px 8px; font-size:15px; color:var(--ink); }
.back .i{ width:20px; height:20px; }
.pbtitle{ font-weight:700; font-size:15px; }
.pagehead{ padding:20px 20px 4px; }
.pagehead h1{ margin:0; font-size:22px; font-weight:700; }
.pad{ padding:8px 20px 16px; }
.h1{ font-size:20px; font-weight:700; line-height:1.4; margin:8px 0 12px; }
.help{ color:var(--muted); font-size:13.5px; margin-top:8px; }
.help a{ color:var(--stamp); }
.help b{ color:var(--ink); }
.notice{ background:var(--surface); border-left:3px solid var(--stamp); padding:10px 12px; font-size:14px; margin:4px 0 12px; border-radius:0 8px 8px 0; }
.err{ color:var(--danger); font-size:13.5px; margin-top:6px; }
.err:empty{ display:none; }
.loading{ color:var(--muted); padding:40px 0; text-align:center; }
.divider{ color:var(--muted); font-size:13.5px; margin:24px 0 0; padding-top:16px; border-top:1px solid var(--rule); }
.prose p + p{ margin-top:10px; }
.filebtn{ cursor:pointer; }

/* 検索 */
.bigopt{ display:flex; gap:16px; align-items:center; width:100%; padding:18px; background:var(--surface); border:1.5px solid var(--rule); border-radius:16px; text-align:left; margin-top:12px; }
.bigopt .i{ width:34px; height:34px; stroke-width:1.6; }
.bigopt b{ display:block; font-size:17px; }
.bigopt span span{ display:block; color:var(--muted); font-size:13.5px; margin-top:2px; }

/* 見つかった本 */
.confirm{ display:flex; flex-direction:column; align-items:center; text-align:center; padding:20px 24px; }
.confirm .cover{ margin-bottom:20px; }
.ctitle{ font-size:20px; font-weight:700; line-height:1.45; overflow-wrap:anywhere; }
.cauthor{ color:var(--muted); font-size:14px; margin-top:4px; }
.cq{ margin-top:22px; font-size:15px; }
.cbtns{ display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%; margin-top:12px; }
.mini{ display:flex; gap:12px; align-items:center; padding:8px 0 4px; }
.mini p{ font-weight:700; line-height:1.4; overflow-wrap:anywhere; }
.statusopts{ display:grid; gap:10px; margin-top:4px; }
.statusopt{ display:block; width:100%; padding:14px 18px; border:1.5px solid var(--rule); border-radius:14px; background:var(--surface); text-align:left; }
.statusopt b{ display:block; font-size:17px; }
.statusopt span{ display:block; font-size:13px; color:var(--muted); }

/* ダイアログ */
.overlay{ position:fixed; inset:0; z-index:30; background:rgba(10,16,22,.45); display:flex; padding:16px; overflow-y:auto; animation:fade .15s ease-out; }
.modal{ margin:auto; width:100%; max-width:420px; min-width:0; background:var(--surface); border-radius:20px; padding:20px; box-shadow:0 12px 40px rgba(0,0,0,.25); animation:pop .18s ease-out; }
@keyframes fade{ from{ opacity:0; } }
@keyframes pop{ from{ opacity:0; transform:scale(.96); } }
.mhead{ display:flex; gap:12px; align-items:center; }
.mtitle{ font-weight:700; font-size:17px; line-height:1.4; overflow-wrap:anywhere; }
.msub{ color:var(--muted); font-size:13px; margin-top:2px; font-variant-numeric:tabular-nums; }
.modal .field input{ min-height:44px; background:var(--paper); }
.infolist .taform{ font-size:16px; font-weight:400; }
.taform .field:first-child{ margin-top:6px; }
.mbtns{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:18px; }
.mbtns.one{ grid-template-columns:1fr; }
.modal.small{ max-width:360px; }
.cfmsg{ font-size:15.5px; line-height:1.7; }
.btn.dangerfill{ background:var(--danger); border-color:var(--danger); color:var(--surface); }
.notice.pv{ margin:0 16px 10px; }
.lastlog{ font-size:13px; color:var(--muted); margin-top:10px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-variant-numeric:tabular-nums; }
.infolist{ margin:18px 0 0; }
.infolist div{ padding:12px 0; border-top:1px solid var(--rule); }
.infolist dt{ font-size:13px; color:var(--muted); }
.infolist dd{ margin:2px 0 0; font-size:17px; font-weight:700; }
.infolist .inline{ margin-top:6px; font-weight:400; }
.mhead > div{ min-width:0; }
.favbtn{ margin-left:auto; flex:none; width:44px; height:44px; display:grid; place-items:center; background:none; border:0; border-radius:50%; color:var(--muted); }
.favbtn .i{ width:26px; height:26px; }
.favbtn[aria-pressed="true"]{ color:var(--star); }
.favbtn[aria-pressed="true"] .i, .rating button.on .i{ fill:currentColor; }
.lbl{ font-size:13px; color:var(--muted); }
.rating{ display:flex; align-items:center; gap:0; margin-top:16px; }
.rating .lbl{ margin-right:10px; }
.rating button{ width:40px; height:40px; display:grid; place-items:center; padding:0; background:none; border:0; border-radius:8px; color:var(--muted); }
.rating button.on{ color:var(--star); }
.rating .i{ width:27px; height:27px; }
.tagedit{ margin-top:14px; }
.tagedit .inline{ margin-top:8px; }
.tagedit .inline input{ min-height:44px; background:var(--paper); }
.tagedit .inline .btn{ min-height:44px; }

/* 並び替えなどのメニュー */
.menuov{ position:fixed; inset:0; z-index:35; }
.menu{ position:fixed; min-width:196px; max-width:calc(100vw - 24px); background:var(--surface); border:1px solid var(--rule); border-radius:14px; box-shadow:0 10px 30px rgba(0,0,0,.22); padding:6px; animation:pop .14s ease-out; }
.menu p{ font-size:12px; color:var(--muted); padding:6px 12px 4px; }
.menu button{ display:flex; align-items:center; justify-content:space-between; gap:16px; width:100%; min-height:46px; padding:0 12px; background:none; border:0; border-radius:9px; font-size:15.5px; text-align:left; }
.menu button[aria-checked="true"]{ font-weight:700; color:var(--stamp); }
.menu button:hover, .menu button:focus-visible{ background:var(--hl); outline:none; }
.menu .i{ width:18px; height:18px; stroke-width:2.6; }

/* 統計 */
.pagehead.split{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding-right:14px; }
.periodbtn{ display:inline-flex; align-items:center; gap:2px; min-height:40px; padding:0 10px 0 16px; border:1.5px solid var(--rule); border-radius:999px; background:var(--surface); font-weight:700; font-size:15px; }
.periodbtn .i{ width:18px; height:18px; }
.periodnav{ display:grid; grid-template-columns:44px 1fr 44px; align-items:center; margin:10px 8px 0; min-height:48px; }
.periodnav p{ text-align:center; font-weight:700; font-size:17px; }
.periodnav .arrow{ width:44px; height:44px; }
.tiles{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:8px 16px 0; }
.tile{ background:var(--surface); border:1px solid var(--rule); border-radius:16px; padding:12px 14px; min-width:0; }
.tile.wide{ grid-column:1 / -1; }
.tile .tl{ display:block; font-size:13px; color:var(--muted); }
.tile .tv{ display:block; font-size:30px; font-weight:700; line-height:1.25; margin-top:2px; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }
.tile .tv small{ font-size:14px; font-weight:400; color:var(--muted); margin-left:3px; }
.tile .ts{ display:block; font-size:12.5px; color:var(--muted); margin-top:2px; }
.sechead{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin:26px 20px 8px; }
.sechead h2{ margin:0; font-size:15.5px; }
.sechead span{ color:var(--muted); font-size:13px; white-space:nowrap; }
.chartbox{ padding:0 14px 0 8px; }
.chart .colb{ fill:var(--stamp); }
.chart .vl{ fill:var(--ink); font-size:9.5px; font-weight:700; }
.covergrid{ list-style:none; margin:0; padding:0 16px; display:grid; grid-template-columns:repeat(auto-fill,minmax(76px,1fr)); gap:16px 12px; }
.cg{ display:flex; flex-direction:column; gap:5px; width:100%; padding:0; background:none; border:0; text-align:left; }
.cgt{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; font-size:12px; line-height:1.4; font-weight:700; }
.cgd{ font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums; }
.morebtn{ display:flex; margin:16px auto 0; min-height:42px; font-size:14px; }
.none{ color:var(--muted); font-size:14px; margin:0 20px; }

/* 設定 */
.sech{ font-size:13.5px; color:var(--muted); font-weight:700; margin:24px 20px 8px; }
.card{ margin:0 16px; padding:16px; background:var(--surface); border:1px solid var(--rule); border-radius:16px; }
.card .btn.block{ margin-top:12px; }

/* ========== 小さな道具 ========== */
function esc(s) {

/* ========== 本の情報を探す（国立国会図書館サーチ） ========== */
// 本の情報は国立国会図書館サーチだけから取る。openBD（データの改変禁止・本の紹介目的に限る）と
// Google Books（ロゴとリンクの表示が必須・保存禁止）は、このアプリの使い方と利用規約が合わないため使わない
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function fetchText(url, ms = 20000) { // 国立国会図書館サーチは数秒〜十数秒かかることがあるので長めに待つ
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), ms);
  try {
    const r = await fetch(url, { signal: c.signal });
    if (!r.ok) {
      const e = new Error('HTTP ' + r.status);
      e.status = r.status;
      e.retryAfter = parseInt(r.headers.get('Retry-After'), 10) || 0;
      throw e;
    }
    return await r.text();
  } finally { clearTimeout(t); }
}
// 国立国会図書館サーチへの問い合わせは、同時に1件だけ、前の問い合わせから1秒以上あけて送る。
// 混み合って断られた（429・503）ときだけ、少し待って2回まで送り直す（遅いだけのときは送り直さない）。
// isStale を渡すと、順番待ちのあいだに不要になった問い合わせ（新しい検索をした等）は送らずにやめる
let ndlChain = Promise.resolve(), ndlLastAt = 0;
function ndlFetch(url, isStale) {
  const run = async () => {
    for (let attempt = 0; ; attempt++) {
      const wait = ndlLastAt + 1000 - Date.now();
      if (wait > 0) await sleep(wait);
      if (isStale && isStale()) { const e = new Error('stale'); e.stale = true; throw e; }
      try { return await fetchText(url); }
      catch (e) {
        if (!(e.status === 429 || e.status === 503) || attempt >= 2) throw e;
        await sleep(e.retryAfter ? Math.min(e.retryAfter, 15) * 1000 : attempt ? 6000 : 3000);
      } finally { ndlLastAt = Date.now(); }
    }
  };
  const p = ndlChain.then(run, run);
  ndlChain = p.catch(() => {});
  return p;
}

// 国立国会図書館の書誌の書き方（「村上, 春樹, 1949-」「書名. 巻名」など）を、ふだんの表記に直す
const VOLCODE = /^[぀-ヿA-Za-z]{1,3}\s*[-‐]?\s*\d+(\s*[-‐]\s*\d+)+$/; // 文庫の番号（「む-5-29」など）
function formatName(raw) {
  const s = String(raw || '').replace(/[／/](著|作|訳|編|絵|文|画|原作|監修|翻訳|イラスト)+/g, '').trim();
  const parts = s.split(/\s*[,，]\s*/).filter(p => p && !/^\d{3,4}\s*-\s*(\d{3,4})?$/.test(p) && !/^(生没年不詳|\d{3,4}生)$/.test(p));
  if (parts.length < 2) return parts[0] || '';
  const [fam, giv] = parts;
  if (/^[\x20-\x7eÀ-ɏ]+$/.test(fam + giv)) return `${giv} ${fam}`;
  return (fam + giv).replace(/\s+/g, '');
}
function joinNames(list) { return [...new Set(list.map(formatName).filter(Boolean))].join('、'); }
function cleanTitle(t) {
  return String(t || '')
    .replace(/\s*[:：]\s*\[[^\]]*\]/g, '')   // 「 : [a novel]」のような補足
    .replace(/([^A-Za-z])\.\s+/g, '$1 ')      // 「書名. 巻名」の区切り
    .replace(/\s+/g, ' ').trim();
}
function withVolume(title, vol) {
  vol = String(vol || '').trim();
  return vol && !VOLCODE.test(vol) && !title.includes(vol) ? `${title} ${vol}` : title;
}
// 読み（カタカナ）は並び替えに使う
function kanaKey(s) { return String(s || '').replace(/[,，]\s*\d{3,4}\s*-\s*(\d{3,4})?/g, '').replace(/[\s,，・]/g, ''); }
function normDate(s) {
  s = String(s || '').trim();
  const m = s.match(/^(\d{4})(\d{2})?(\d{2})?$/) || s.match(/^(\d{4})(?:[-./年]\s*(\d{1,2}))?(?:[-./月]\s*(\d{1,2}))?/);
  if (!m) return '';
  const mo = m[2] ? Number(m[2]) : 0, d = m[3] ? Number(m[3]) : 0;
  if (!mo || mo > 12) return m[1];
  return `${m[1]}-${pad2(mo)}` + (d && d <= 31 ? `-${pad2(d)}` : '');
}

function parseNdlItem(it) {
  const all = n => [...it.getElementsByTagName(n)].map(e => e.textContent.trim()).filter(Boolean);
  const one = n => all(n)[0] || '';
  let isbn = null;
  for (const e of it.getElementsByTagName('dc:identifier')) {
    if (e.getAttribute('xsi:type') === 'dcndl:ISBN' && (isbn = normalizeIsbn(e.textContent))) break;
  }
  if (!isbn) return null;
  const vol = one('dcndl:volume');
  const pages = [...one('dc:extent').matchAll(/(\d+)\s*[pP]/g)].map(m => Number(m[1]));
  const tk = kanaKey(one('dcndl:titleTranscription'));
  return {
    isbn,
    title: withVolume(cleanTitle(one('dc:title')), vol),
    author: joinNames(all('dc:creator')),
    publisher: one('dc:publisher'),
    pubdate: normDate(one('dcterms:issued') || one('dc:date')),
    totalPages: pages.length ? Math.max(...pages) : null,
    titleKana: tk ? tk + (VOLCODE.test(vol) ? '' : vol) : '',
    authorKana: kanaKey(one('dcndl:creatorTranscription')),
  };
}
// 国立国会図書館サーチで本（ISBNがあるものだけ）を探す。
// 検索対象は国立国会図書館自身のデータ（蔵書と新着書誌情報。どちらも CC BY 4.0）に絞る。
// ほかの提供元のデータは利用条件がそれぞれ違うため含めない
const NDL_DPID = 'iss-ndl-opac iss-ndl-opac-inprocess';
// キーワード検索は OpenSearch を使う（SRU は1冊あたりのデータが大きく、20件で1MB以上になるため）
async function ndlSearch(params, idx = 1, cnt = 30, isStale) {
  const q = new URLSearchParams({ ...params, dpid: NDL_DPID, mediatype: 'books', cnt: String(cnt), idx: String(idx) });
  const xml = new DOMParser().parseFromString(await ndlFetch(`${NDL_API}?${q}`, isStale), 'application/xml');
  const total = parseInt(xml.getElementsByTagName('openSearch:totalResults')[0]?.textContent, 10) || 0;
  const seen = new Set();
  const items = [...xml.getElementsByTagName('item')].map(parseNdlItem)
    .filter(x => x && !seen.has(x.isbn) && seen.add(x.isbn));
  return { total, items };
}

// SRU（図書館の蔵書検索の標準の問い合わせ方）の結果1件（DC-NDL形式）を読む
function parseDcndl(rec) {
  const hasIsbn = b => [...b.children].some(c => c.tagName === 'dcterms:identifier' && /ISBN$/.test(c.getAttribute('rdf:datatype') || ''));
  const bib = [...rec.getElementsByTagName('dcndl:BibResource')].find(hasIsbn);
  if (!bib) return null;
  const kids = name => [...bib.children].filter(c => c.tagName === name);
  const text = el => (el ? el.textContent : '').trim();
  const first = (el, name) => (el ? el.getElementsByTagName(name)[0] : null);
  const value = el => text(first(el, 'rdf:value')) || text(el); // 「値」と「読み」に分かれているときは値だけ
  let isbn = null;
  for (const c of kids('dcterms:identifier')) {
    if (/ISBN$/.test(c.getAttribute('rdf:datatype') || '') && (isbn = normalizeIsbn(c.textContent))) break;
  }
  if (!isbn) return null;
  const titleEl = kids('dc:title')[0], volEl = kids('dcndl:volume')[0];
  const vol = value(volEl);
  const creators = kids('dcterms:creator');
  // 構造化された著者がないときは「山田太郎 著」のような責任表示から名前だけを取る
  const names = creators.length ? creators.map(c => text(first(c, 'foaf:name')))
    : kids('dc:creator').map(c => text(c).split(/\s+/)[0]);
  const pages = [...text(kids('dcterms:extent')[0]).matchAll(/(\d+)\s*[pP]/g)].map(m => Number(m[1]));
  const tk = kanaKey(text(first(titleEl, 'dcndl:transcription')));
  return {
    isbn,
    title: withVolume(cleanTitle(value(titleEl) || text(kids('dcterms:title')[0])), vol),
    author: joinNames(names),
    publisher: text(first(kids('dcterms:publisher')[0], 'foaf:name')),
    pubdate: normDate(text(kids('dcterms:date')[0]) || text(kids('dcterms:issued')[0])),
    totalPages: pages.length ? Math.max(...pages) : null,
    titleKana: tk ? tk + (VOLCODE.test(vol) ? '' : vol) : '',
    authorKana: kanaKey(text(first(creators[0], 'dcndl:transcription'))),
  };
}
// ISBNで本を探す（SRU）。見つからなければ null、通信できないときや混み合っているときはエラーを投げる。
// 計測では OpenSearch より断られにくかったので、ISBN の検索には SRU を使う
async function lookupSRU(isbn) {
  const q = new URLSearchParams({
    operation: 'searchRetrieve', recordSchema: 'dcndl', recordPacking: 'xml', maximumRecords: '3',
    query: `isbn="${isbn}" AND dpid="${NDL_DPID}"`,
  });
  const xml = new DOMParser().parseFromString(await ndlFetch(`${NDL_SRU}?${q}`), 'application/xml');
  const recs = [...xml.getElementsByTagName('recordData')];
  if (!recs.length && xml.getElementsByTagName('diagnostic').length) {
    throw new Error('SRU: ' + (xml.getElementsByTagName('message')[0]?.textContent || 'error'));
  }
  for (const r of recs) {
    const x = parseDcndl(r);
    if (x && x.isbn === isbn && x.title) return { ...x, totalPages: toPosInt(x.totalPages) };
  }
  return null;
}
// 一度調べたISBNは、アプリを開いている間は覚えておき、同じ問い合わせを二度送らない
// （問い合わせ中に同じISBNを読み取ったときも、その結果を待つ）。失敗したときは次にまた探せるよう忘れる
const lookupCache = new Map();
function lookup(isbn) {
  if (!lookupCache.has(isbn)) {
    const p = lookupSRU(isbn);
    lookupCache.set(isbn, p);
    p.catch(() => lookupCache.delete(isbn));
  }
  return lookupCache.get(isbn);
}

// 以前に追加した本で足りない情報（発売日・読み・ページ数・出版社）を、国立国会図書館サーチから補う。
// タイトルと著者は、利用者が見慣れた表記のまま変えない。
// 利用者の検索の邪魔をせず、国立国会図書館サーチに負担をかけないよう、
// 起動から1分たってから、検索の画面を開いていないときだけ、1日5冊まで、1冊ずつ10秒あけて問い合わせる
const BACKFILL_KEY = 'dokusho-backfill';
const BACKFILL_PER_DAY = 5;
let backfillStarted = false;
async function backfillMeta() {
  if (backfillStarted || !navigator.onLine || !storageOK) return;
  backfillStarted = true;
  const today = localDate();
  let used = 0;
  try { const d = JSON.parse(localStorage.getItem(BACKFILL_KEY) || '{}'); if (d.date === today) used = Number(d.n) || 0; } catch {}
  const now = Date.now();
  const targets = state.books.filter(b => /^\d{13}$/.test(b.isbn) && (!b.metaAt || now - b.metaAt > 30 * 864e5)
    && (!b.pubdate || !b.titleKana || !b.totalPages || !b.publisher)).slice(0, Math.max(0, BACKFILL_PER_DAY - used));
  const busy = () => document.hidden || ['search', 'keyword', 'scan', 'manual', 'found'].includes(ui.page);
  let changed = false;
  for (const b of targets) {
    if (busy()) break; // 検索しているときはやめて、次に開いたときにまわす
    let info;
    try { info = await lookup(b.isbn); } catch { break; } // 混み合っているときも次にまわす
    used++;
    try { localStorage.setItem(BACKFILL_KEY, JSON.stringify({ date: today, n: used })); } catch {}
    b.metaAt = Date.now();
    if (info) for (const k of ['pubdate', 'titleKana', 'authorKana', 'publisher', 'totalPages']) {
      if (!b[k] && info[k]) { b[k] = info[k]; changed = true; }
    }
    save();
    await sleep(10000);
  }
  if (changed && !document.querySelector('.overlay, .menuov')) refresh();
}

/* ========== 画面の切り替え（戻るボタン対応） ========== */
const layers = [];
let layerSeq = 0;
// Claudeのプレビュー画面など、URLを書き換えられない環境でも動くようにする
function histCall(method, st, hash) {
  try { history[method](st, '', hash); return true; } catch {}
  try { history[method](st, ''); return true; } catch {}
  return false;
}
function curDepth() { const st = history.state; return (st && typeof st.d === 'number') ? st.d : 0; }
function nav(hash) { histCall('pushState', { d: curDepth() + 1, h: hash }, hash); ui.hash = hash; route(); }
function navReplace(hash) { histCall('replaceState', { d: curDepth(), h: hash }, hash); ui.hash = hash; route(); }
function goBack(fallback = '#/') { if (curDepth() > 0) history.back(); else navReplace(fallback); }
// 本を追加し終えたら、途中の画面を履歴から消してホームへ戻る
function backTo(hash) {
  const d = curDepth();
  if (d > 0) { ui.afterPop = hash; history.go(-d); } else navReplace(hash);
}
// ダイアログや選択モードは「戻る」で閉じられるよう、履歴に1つ積む
function pushLayer(close) {
  const id = ++layerSeq;
  layers.push({ id, close });
  histCall('pushState', { d: curDepth() + 1, layer: id, h: ui.hash }, ui.hash);
  return id;
}
function popLayer() {
  if (!layers.length) return;
  const st = history.state;
  if (st && st.layer === layers[layers.length - 1].id) history.back();
  else layers.pop().close(); // 履歴に積めなかったときは直接閉じる
}
window.addEventListener('popstate', () => {
  const st = history.state || {};
  while (layers.length && layers[layers.length - 1].id !== st.layer) layers.pop().close();
  if (ui.afterPop) { const h = ui.afterPop; ui.afterPop = null; return navReplace(h); }
  const h = st.h || location.hash || '#/';
  if (h !== ui.renderedHash) { ui.hash = h; route(); }
});
document.addEventListener('click', e => {
  const a = e.target.closest('a[data-nav]');
  if (a) { e.preventDefault(); nav(a.getAttribute('href')); return; }
  const t = e.target.closest('[data-tabnav]');
  if (t) {
    const h = t.dataset.tabnav;
    if (h === '#/cal') { ui.barPick = null; ui.calPick = null; ui.ymOpen = false; }
    if (h === '#/stats') ui.statAll = {};
    if (ui.hash !== h) navReplace(h);
  }
});
function route() {
  ui.renderToken++;
  const h = ui.hash || '#/';
  ui.renderedHash = h;
  const raw = h.slice(1) || '/';
  const qi = raw.indexOf('?');
  const path = qi >= 0 ? raw.slice(0, qi) : raw;
  const params = new URLSearchParams(qi >= 0 ? raw.slice(qi + 1) : '');
  if (path !== '/scan') stopScanner();
  document.body.classList.toggle('scanning', path === '/scan');
  window.scrollTo(0, 0);
  if (path === '/search') return renderSearch();
  if (path === '/keyword') return renderKeyword();
  if (path === '/scan') return renderScan();
  if (path === '/manual') return renderManual();
  if (path === '/found') return renderFound(params.get('isbn'));
  if (path === '/cal') return renderCal();
  if (path === '/stats') return renderStats();
  if (path === '/settings' || path === '/data') return renderSettings();
  return renderHome();
}
// データが変わったときに、いまの画面を描き直す（スクロール位置はそのまま）
function refresh() {
  const f = { home: renderHome, cal: renderCal, stats: renderStats, settings: renderSettings }[ui.page];
  if (f) f();
}

/* ========== 画面の部品 ========== */
function progressOf(b) { return b.logs.reduce((m, l) => Math.max(m, l.end), 0); }
function lastDate(b) { return b.logs.reduce((m, l) => (l.date > m ? l.date : m), ''); }
function lastCreated(b) { return b.logs.reduce((m, l) => (!m || l.createdAt > m.createdAt ? l : m), null); }
function todayPages() {
  const t = localDate();
  let s = 0;
  for (const b of state.books) for (const l of b.logs) if (l.date === t) s += l.pages;
  return s;
}
// 表紙は画像を使わず、本ごとの色にタイトルを書いた背表紙風の表紙にする
// （国立国会図書館の書影APIは2026年3月末で提供終了。ほかの表紙画像は利用条件が合わないため使わない）
function coverHtml(b, size) {
  return `<span class="cover ${size} ph" style="--c:${colorOf(b)}" aria-hidden="true"><span>${esc(b.title || '')}</span></span>`;
}
function pageBar(title, fallback = '#/') {
  return `<header class="pagebar"><button type="button" class="back" id="back" data-fallback="${esc(fallback)}">${ICON.back}戻る</button>${title ? `<p class="pbtitle">${esc(title)}</p>` : ''}</header>`;
}
function navHtml(active) {
  const items = [['home', '#/', 'ホーム', ICON.home], ['search', '#/search', '検索', ICON.search], ['cal', '#/cal', 'カレンダー', ICON.cal],
    ['stats', '#/stats', '統計', ICON.chart], ['settings', '#/settings', '設定', ICON.gear]];
  return `<nav class="nav" aria-label="メニュー"><div class="in">${items.map(([k, h, l, ic]) =>
    `<button type="button" data-tabnav="${h}" ${k === active ? 'aria-current="page"' : ''}><span class="ic">${ic}</span>${l}</button>`).join('')}</div></nav>`;
}
function paint(html) {
  app.innerHTML = html;
  const back = document.getElementById('back');
  if (back) back.onclick = () => goBack(back.dataset.fallback || '#/');
}
function progressHtml(b) {
  if (b.status === 'want' && !b.logs.length) return '';
  if (!b.logs.length && !b.totalPages) return '';
  const p = progressOf(b), t = b.totalPages;
  const pct = t ? Math.min(100, Math.round((p / t) * 100)) : null;
  const last = lastDate(b);
  return `<span class="prog">${pct != null ? `<span class="bar"><i style="width:${pct}%"></i></span>` : ''}
    <span class="progtext"><span>${t ? `${p} / ${t}ページ` : `${p}ページ目まで`}</span>${last ? `<span>最後に読んだ日 ${fmtMD(last)}</span>` : ''}</span></span>`;
}


// フォームの送信（プレビュー画面では送信イベントが止められるため、ボタンのクリックでも受け付ける）
function onSubmit(form, handler) {
  let busy = false;
  const run = async e => {
    if (e) e.preventDefault();
    if (busy) return;
    busy = true;
    try { await handler(); } finally { busy = false; }
  };
  form.addEventListener('submit', run);
  form.querySelectorAll('button:not([type="button"])').forEach(b => b.addEventListener('click', run));
}

/* ========== ダイアログ ========== */
function openModal(build) {
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle"></div>';
  document.body.appendChild(ov);
  document.body.classList.add('modal-open');
  const m = ov.firstChild;
  const ctx = { changed: false };
  ov.addEventListener('click', e => { if (e.target === ov) popLayer(); });
  ov.addEventListener('keydown', e => { if (e.key === 'Escape') popLayer(); });
  pushLayer(() => {
    ov.remove();
    if (!document.querySelector('.overlay')) document.body.classList.remove('modal-open');
    if (ctx.changed) refresh();
  });
  build(m, ctx);
  return ctx;
}

// ボタンの下に出す選択メニュー（並び替え・期間）。選んだ項目のキーを返す（閉じただけなら null）
function openMenu(anchor, title, options, current) {
  return new Promise(resolve => {
    let result = null;
    const ov = document.createElement('div');
    ov.className = 'menuov';
    ov.innerHTML = `<div class="menu" role="menu" aria-label="${esc(title)}"><p aria-hidden="true">${esc(title)}</p>${options.map(([k, l]) =>
      `<button type="button" role="menuitemradio" aria-checked="${k === current}" data-k="${k}"><span>${esc(l)}</span>${k === current ? ICON.check : ''}</button>`).join('')}</div>`;
    document.body.appendChild(ov);
    const menu = ov.firstChild;
    const r = anchor.getBoundingClientRect();
    const mw = menu.offsetWidth, mh = menu.offsetHeight;
    menu.style.left = Math.max(12, Math.min(r.right - mw, innerWidth - mw - 12)) + 'px';
    menu.style.top = (r.bottom + 6 + mh > innerHeight - 12 ? Math.max(12, r.top - mh - 6) : r.bottom + 6) + 'px';
    pushLayer(() => { ov.remove(); resolve(result); });
    ov.addEventListener('click', e => {
      const b = e.target.closest('[data-k]');
      if (b) { result = b.dataset.k; popLayer(); }
      else if (!menu.contains(e.target)) popLayer();
    });
    ov.addEventListener('keydown', e => {
      if (e.key === 'Escape') popLayer();
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        const bs = [...menu.querySelectorAll('button')];
        const i = bs.indexOf(document.activeElement);
        bs[(i + (e.key === 'ArrowDown' ? 1 : bs.length - 1)) % bs.length].focus();
      }
    });
    setTimeout(() => (menu.querySelector('[aria-checked="true"]') || menu.querySelector('button')).focus(), 20);
  });
}


// 確認用の小さなダイアログ（ブラウザ標準のconfirmはプレビュー画面で使えないため）
function askConfirm(message, okLabel = 'OK', danger = false) {
  return new Promise(resolve => {
    let result = false;
    const ov = document.createElement('div');
    ov.className = 'overlay';
    ov.innerHTML = `<div class="modal small" role="alertdialog" aria-modal="true" aria-labelledby="cfMsg">
      <p id="cfMsg" class="cfmsg">${esc(message)}</p>
      <div class="mbtns"><button type="button" class="btn" data-cf="0">キャンセル</button><button type="button" class="btn ${danger ? 'dangerfill' : 'primary'}" data-cf="1">${esc(okLabel)}</button></div></div>`;
    document.body.appendChild(ov);
    document.body.classList.add('modal-open');
    pushLayer(() => {
      ov.remove();
      if (!document.querySelector('.overlay')) document.body.classList.remove('modal-open');
      resolve(result);
    });
    ov.addEventListener('click', e => {
      const b = e.target.closest('[data-cf]');
      if (b) { result = b.dataset.cf === '1'; popLayer(); }
      else if (e.target === ov) popLayer();
    });
    ov.addEventListener('keydown', e => { if (e.key === 'Escape') popLayer(); });
    setTimeout(() => ov.querySelector('[data-cf="1"]').focus(), 30);
  });
}

// 読書の記録（画面の中央に表示）
function openRecord(b) {
  openModal((m, ctx) => {
    const draw = () => {
      const prog = progressOf(b);
      const today = localDate();
      const last = lastCreated(b);
      const mode = state.settings.mode;
      m.innerHTML = `
      <div class="mhead">${coverHtml(b, 'xs')}<div><p class="mtitle" id="mTitle">${esc(b.title)}</p>
        <p class="msub">${b.totalPages ? `${prog} / ${b.totalPages}ページ` : `${prog}ページ目まで`}</p></div></div>
      <form id="logForm" novalidate>
        <label class="field"><span>日付</span><input type="date" name="date" value="${today}" max="${today}"></label>
        <fieldset class="seg"><legend>記録のしかた</legend><div class="opts">
          <label><input type="radio" name="mode" value="pages" ${mode === 'pages' ? 'checked' : ''}><span>読んだページ数</span></label>
          <label><input type="radio" name="mode" value="end" ${mode === 'end' ? 'checked' : ''}><span>何ページ目まで</span></label>
        </div></fieldset>
        <div class="numrow">
          <input name="n" type="number" inputmode="numeric" min="1" placeholder="0" aria-label="ページ" aria-describedby="hint">
          <span class="unit" id="unit"></span>
        </div>
        <p class="hint" id="hint" aria-live="polite"></p>
        ${b.status === 'want' ? '<p class="help">記録すると「読書中」に移動します。</p>' : ''}
        ${last ? `<p class="lastlog">前回の記録：${fmtMD(last.date)}　${last.pages}ページ<button type="button" class="linkbtn" id="undo">取り消す</button></p>` : ''}
        <div class="mbtns"><button type="button" class="btn" id="mCancel">キャンセル</button><button class="btn primary">記録する</button></div>
      </form>`;
      const form = m.querySelector('#logForm');
      const f = form.elements;
      const unit = m.querySelector('#unit'), hint = m.querySelector('#hint');
      const update = () => {
        const md = f.mode.value;
        const n = parseInt(f.n.value, 10);
        unit.textContent = md === 'pages' ? 'ページ' : 'ページ目まで';
        hint.classList.remove('bad');
        if (!(n > 0)) {
          hint.textContent = prog ? `今は${prog}ページ目まで読んでいます` : 'はじめての記録です';
        } else if (md === 'pages') {
          const end = prog + n;
          if (b.totalPages && end > b.totalPages) { hint.textContent = `総ページ数（${b.totalPages}ページ）を超えています`; hint.classList.add('bad'); }
          else hint.textContent = `${end}ページ目まで読んだことになります`;
        } else if (n > prog) {
          if (b.totalPages && n > b.totalPages) { hint.textContent = `総ページ数（${b.totalPages}ページ）を超えています`; hint.classList.add('bad'); }
          else hint.textContent = `${n - prog}ページ読んだことになります`;
        } else {
          hint.textContent = `今の記録は${prog}ページ目までです。それより後のページを入れてください`;
          hint.classList.add('bad');
        }
      };
      form.addEventListener('input', update);
      form.addEventListener('change', e => {
        if (e.target.name === 'mode') { state.settings.mode = f.mode.value; save(); }
        update();
      });
      update();
      m.querySelector('#mCancel').onclick = () => popLayer();
      const undo = m.querySelector('#undo');
      if (undo) undo.onclick = async () => {
        if (!(await askConfirm(`${fmtMD(last.date)}の記録（${last.pages}ページ）を取り消しますか？`, '取り消す', true))) return;
        b.logs = b.logs.filter(x => x !== last);
        b.updatedAt = Date.now();
        if (save()) { ctx.changed = true; toast('記録を取り消しました'); draw(); }
      };
      onSubmit(form, async () => {
        const md = f.mode.value;
        const n = parseInt(f.n.value, 10);
        const date = f.date.value || today;
        if (!(n > 0)) { hint.textContent = 'ページ数を入れてください'; hint.classList.add('bad'); f.n.focus(); return; }
        if (date > today) { hint.textContent = 'これから先の日付には記録できません'; hint.classList.add('bad'); return; }
        let end, pages;
        if (md === 'pages') { pages = n; end = prog + n; }
        else {
          if (n <= prog) { update(); f.n.focus(); return; }
          end = n; pages = n - prog;
        }
        if (b.totalPages && end > b.totalPages) {
          if (!(await askConfirm(`総ページ数（${b.totalPages}ページ）を超えています。総ページ数を${end}ページに直して記録しますか？`, '直して記録する'))) return;
          b.totalPages = end;
        }
        b.logs.push({ id: uid(), date, start: prog, end, pages, createdAt: Date.now() });
        let msg = '記録しました';
        if (b.status === 'want') { b.status = 'reading'; msg = '記録して「読書中」に移動しました'; }
        if (b.totalPages && end >= b.totalPages && b.status !== 'done') {
          b.status = 'done'; b.finishedAt = Date.now();
          msg = '最後まで読んだので「読了」に移動しました';
        }
        b.updatedAt = Date.now();
        if (!save()) return;
        ctx.changed = true;
        toast(msg);
        popLayer();
      });
      setTimeout(() => f.n.focus(), 50);
    };
    draw();
  });
}

// 本の情報（タイトル・著者の修正、お気に入り・評価・タグ・総ページ数・読み終わった日）
function openInfo(b) {
  openModal((m, ctx) => {
    let editing = null;
    const changed = () => {
      b.updatedAt = Date.now();
      if (!save()) return false;
      ctx.changed = true;
      return true;
    };
    const draw = focusSel => {
      const today = localDate();
      const others = allTags().map(([t]) => t).filter(t => !b.tags.includes(t));
      m.innerHTML = `<div class="mhead">${coverHtml(b, 'xs')}<div><p class="mtitle" id="mTitle">${esc(b.title)}</p>${b.author ? `<p class="msub">${esc(b.author)}</p>` : ''}</div>
        <button type="button" class="favbtn" id="favBtn" aria-pressed="${b.favorite}" aria-label="お気に入り">${ICON.star}</button></div>` + `
      <div class="rating" role="radiogroup" aria-label="評価"><span class="lbl" aria-hidden="true">評価</span>${[1, 2, 3, 4, 5].map(n =>
        `<button type="button" role="radio" aria-checked="${b.rating === n}" aria-label="星${n}つ" class="${n <= b.rating ? 'on' : ''}" data-rate="${n}">${ICON.star}</button>`).join('')}</div>
      <div class="tagedit"><p class="lbl">タグ</p>
        ${b.tags.length ? `<div class="chips wrap">${b.tags.map(t => `<span class="chip on">${esc(t)}<button type="button" class="x" data-untag="${esc(t)}" aria-label="タグ「${esc(t)}」を外す">${ICON.x}</button></span>`).join('')}</div>` : ''}
        <form class="inline" id="tagForm" novalidate><input name="tag" maxlength="30" autocomplete="off" placeholder="新しいタグ（例：小説、仕事）" aria-label="新しいタグ"><button class="btn">追加</button></form>
        ${others.length ? `<div class="chips wrap">${others.map(t => `<button type="button" class="chip add" data-addtag="${esc(t)}" aria-label="タグ「${esc(t)}」を付ける">＋ ${esc(t)}</button>`).join('')}</div>` : ''}
      </div>
      <dl class="infolist">
        <div><dt>タイトル・著者</dt><dd>${editing === 'ta'
          ? `<form id="taForm" class="taform" novalidate>
              <label class="field"><span>タイトル（必須）</span><input name="title" value="${esc(b.title)}" maxlength="200" autocomplete="off"></label>
              <label class="field"><span>著者</span><input name="author" value="${esc(b.author)}" maxlength="200" autocomplete="off"></label>
              <p class="err" id="taErr" role="alert"></p>
              <div class="mbtns"><button type="button" class="btn" id="taCancel">キャンセル</button><button class="btn primary">保存</button></div>
            </form>`
          : `<button type="button" class="linkbtn" id="taEdit">変更</button>`}</dd></div>
        <div><dt>状態</dt><dd>${STATUS[b.status]}</dd></div>
        <div><dt>アプリに追加した日</dt><dd>${fmtLong(tsDate(b.createdAt))}</dd></div>
        ${b.pubdate ? `<div><dt>発売日</dt><dd>${pubLabel(b.pubdate)}</dd></div>` : ''}
        <div><dt>総ページ数</dt><dd>${editing === 'tp'
          ? `<form class="inline" id="tpForm" novalidate><input name="tp" type="number" inputmode="numeric" min="1" value="${b.totalPages || ''}" aria-label="総ページ数"><button class="btn primary">保存</button></form>`
          : `${b.totalPages ? b.totalPages + 'ページ' : 'まだ入力していません'} <button type="button" class="linkbtn" id="tpEdit">変更</button>`}</dd></div>
        ${b.status === 'done' ? `<div><dt>読み終わった日</dt><dd>${editing === 'fd'
          ? `<form class="inline" id="fdForm" novalidate><input name="fd" type="date" value="${tsDate(b.finishedAt || Date.now())}" max="${today}" aria-label="読み終わった日"><button class="btn primary">保存</button></form>`
          : `${b.finishedAt ? fmtLong(tsDate(b.finishedAt)) : '—'} <button type="button" class="linkbtn" id="fdEdit">変更</button>`}</dd></div>` : ''}
      </dl>
      <div class="mbtns one"><button type="button" class="btn" id="mClose">閉じる</button></div>`;
      const $ = s => m.querySelector(s);
      $('#mClose').onclick = () => popLayer();
      $('#favBtn').onclick = () => {
        b.favorite = !b.favorite;
        if (changed()) { toast(b.favorite ? 'お気に入りに追加しました' : 'お気に入りから外しました'); draw('#favBtn'); }
      };
      m.querySelectorAll('[data-rate]').forEach(el => el.onclick = () => {
        const n = Number(el.dataset.rate);
        b.rating = b.rating === n ? 0 : n; // 同じ星をもう一度タップすると評価を消す
        if (changed()) draw(`[data-rate="${n}"]`);
      });
      m.querySelectorAll('[data-untag]').forEach(el => el.onclick = () => {
        b.tags = b.tags.filter(t => t !== el.dataset.untag);
        if (changed()) draw('#tagForm button');
      });
      m.querySelectorAll('[data-addtag]').forEach(el => el.onclick = () => {
        if (!b.tags.includes(el.dataset.addtag)) b.tags.push(el.dataset.addtag);
        if (changed()) draw('#tagForm button');
      });
      const tagForm = $('#tagForm');
      onSubmit(tagForm, () => {
        // 「、」やカンマで区切ると、いくつかまとめて付けられる
        const add = tagForm.elements.tag.value.split(/[,、，]/).map(s => s.trim().slice(0, 30)).filter(s => s && !b.tags.includes(s));
        if (!add.length) { tagForm.elements.tag.focus(); return; }
        b.tags.push(...new Set(add));
        if (changed()) draw('#tagForm input');
      });
      const taEdit = $('#taEdit');
      if (taEdit) taEdit.onclick = () => { editing = 'ta'; draw('input[name=title]'); };
      const taf = $('#taForm');
      if (taf) {
        $('#taCancel').onclick = () => { editing = null; draw('#taEdit'); };
        onSubmit(taf, () => {
          const title = taf.elements.title.value.trim(), author = taf.elements.author.value.trim();
          if (!title) { $('#taErr').textContent = 'タイトルを入力してください。'; taf.elements.title.focus(); return; }
          // 並び替え用の読みは元の表記のものなので、書き換えたら消す（読みがないときは表記で並べる）
          if (title !== b.title) { b.title = title; b.titleKana = ''; }
          if (author !== b.author) { b.author = author; b.authorKana = ''; }
          editing = null;
          if (changed()) toast('タイトルと著者を保存しました');
          draw('#taEdit');
        });
      }
      const tpEdit = $('#tpEdit');
      if (tpEdit) tpEdit.onclick = () => { editing = 'tp'; draw('input[name=tp]'); };
      const tf = $('#tpForm');
      if (tf) onSubmit(tf, () => {
        b.totalPages = toPosInt(tf.elements.tp.value);
        editing = null;
        if (changed()) toast('総ページ数を保存しました');
        draw('#tpEdit');
      });
      const fdEdit = $('#fdEdit');
      if (fdEdit) fdEdit.onclick = () => { editing = 'fd'; draw('input[name=fd]'); };
      const ff = $('#fdForm');
      if (ff) onSubmit(ff, () => {
        const v = ff.elements.fd.value;
        if (!/^\d{4}-\d{2}-\d{2}$/.test(v) || v > localDate()) { ff.elements.fd.focus(); return; }
        b.finishedAt = parseLocal(v).getTime() + 12 * 3600e3;
        editing = null;
        if (changed()) toast('読み終わった日を保存しました');
        draw('#fdEdit');
      });
      if (focusSel) { const f = $(focusSel); if (f) f.focus(); }
    };
    draw();
    setTimeout(() => m.querySelector('#mClose')?.focus(), 50);
  });
}

/* ========== ホーム ========== */
// 本に付いているタグの一覧（[タグ, 冊数]、名前順）
function allTags() {
  const m = new Map();
  state.books.forEach(b => b.tags.forEach(t => m.set(t, (m.get(t) || 0) + 1)));
  return [...m.entries()].sort((a, b) => collator.compare(a[0], b[0]));
}
function inTab(b, tab) { return tab === 'all' || (tab === 'fav' ? b.favorite : b.status === tab); }
// タイトル・著者は読み（カタカナ）があれば読みで、なければ表記で並べる
function titleKey(b) { return b.titleKana || b.title; }
function sortBooks(list, key) {
  const newer = (a, b) => b.createdAt - a.createdAt;
  const cmp = {
    added: newer,
    oldest: (a, b) => a.createdAt - b.createdAt,
    pubdate: (a, b) => (!a.pubdate - !b.pubdate) || (a.pubdate < b.pubdate ? 1 : a.pubdate > b.pubdate ? -1 : 0) || newer(a, b),
    title: (a, b) => collator.compare(titleKey(a), titleKey(b)) || newer(a, b),
    author: (a, b) => (!a.author - !b.author) || collator.compare(a.authorKana || a.author, b.authorKana || b.author) || collator.compare(titleKey(a), titleKey(b)),
    rating: (a, b) => (b.rating - a.rating) || newer(a, b),
  }[key] || newer;
  return [...list].sort(cmp);
}
function starsHtml(r) {
  return `<span class="stars" role="img" aria-label="評価${r}">${'★'.repeat(r)}<span class="off">${'★'.repeat(5 - r)}</span></span>`;
}
function renderHome() {
  ui.page = 'home';
  const sel = ui.selecting;
  const tags = allTags();
  if (ui.tagFilter && !tags.some(([t]) => t === ui.tagFilter)) ui.tagFilter = null;
  const tf = ui.tagFilter;
  const pool = tf ? state.books.filter(b => b.tags.includes(tf)) : state.books;
  const counts = Object.fromEntries(TABS.map(([k]) => [k, pool.filter(b => inTab(b, k)).length]));
  const list = sortBooks(pool.filter(b => inTab(b, ui.tab)), state.settings.sort);
  const sortLabel = SORTS.find(([k]) => k === state.settings.sort)[1];
  const showStatus = ui.tab === 'all' || ui.tab === 'fav';
  let body;
  if (!state.books.length) {
    body = `<div class="empty"><p class="etitle">本棚はまだ空です</p><p>下の「検索」から、バーコードやISBN、タイトルなどで本を追加できます。</p></div>`;
  } else if (!list.length) {
    const where = TABS.find(([k]) => k === ui.tab)[1];
    body = `<div class="empty"><p>${tf ? `タグ「${esc(tf)}」が付いた` : ''}「${where}」の本はありません。</p>
      ${ui.tab === 'fav' && !tf ? `<p>本の右にある ⓘ を開いて☆をタップすると、お気に入りに追加できます。</p>` : ''}</div>`;
  } else {
    body = `<ul class="shelf${sel ? ' selecting' : ''}">${list.map(b => {
      const on = sel && ui.selected.has(b.id);
      const meta = [
        showStatus ? `<span class="tag">${STATUS[b.status]}</span>` : '',
        b.rating ? starsHtml(b.rating) : '',
        ...b.tags.map(t => `<span class="ttag">${esc(t)}</span>`),
      ].join('');
      return `<li class="${on ? 'sel' : ''}">
        <button type="button" class="rowbtn" data-book="${esc(b.id)}" ${sel ? `aria-pressed="${on}"` : ''}>
          ${sel ? `<span class="check">${ICON.check}</span>` : ''}${coverHtml(b, 'sm')}
          <span class="rowbody"><span class="title">${b.favorite ? '<span class="favmark" role="img" aria-label="お気に入り">★</span>' : ''}${esc(b.title)}</span>${b.author ? `<span class="author">${esc(b.author)}</span>` : ''}
          ${meta ? `<span class="meta">${meta}</span>` : ''}${progressHtml(b)}</span>
        </button>
        ${sel ? '' : `<button type="button" class="info" data-info="${esc(b.id)}" aria-label="「${esc(b.title)}」の情報">${ICON.info}</button>`}
      </li>`;
    }).join('')}</ul>`;
  }
  const tools = state.books.length ? `<div class="tools">
    ${tags.length
      ? `<div class="chips" role="group" aria-label="タグで絞り込み">${ICON.tag}${tags.map(([t]) =>
        `<button type="button" class="chip" data-tagf="${esc(t)}" aria-pressed="${t === tf}">${esc(t)}${t === tf ? ICON.x : ''}</button>`).join('')}</div>`
      : `<p class="shown">${list.length}冊</p>`}
    <button type="button" class="sortbtn" id="sortBtn" aria-haspopup="menu" aria-label="並び替え（いまは${sortLabel}）">${ICON.sort}${sortLabel}</button>
  </div>` : '';
  const header = sel
    ? `<header class="top"><h1 class="brand">読書ノート</h1><p class="selcount" aria-live="polite">${ui.selected.size}冊を選択中</p></header>`
    : `<header class="top"><h1 class="brand">読書ノート</h1><p class="today">今日<b>${todayPages()}</b>ページ</p>${state.books.length ? '<button type="button" class="selbtn" id="selBtn">選択</button>' : ''}</header>`;
  let bottom;
  if (sel) {
    const targets = STATUS_KEYS.filter(k => ui.tab === 'all' || k !== ui.tab);
    const none = ui.selected.size === 0 ? 'disabled' : '';
    bottom = `<div class="selbar ${targets.length === 3 ? 'c3' : 'c2'}"><div class="in">
      ${targets.map(k => `<button type="button" class="btn primary mv" data-move="${k}" ${none}>${STATUS[k]}に移動</button>`).join('')}
      <button type="button" class="btn danger ft" id="selDel" ${none}>削除</button>
      <button type="button" class="btn ft" id="selBack">戻る</button>
    </div></div>`;
  } else {
    bottom = navHtml('home');
  }
  const pv = storageOK ? '' : '<p class="notice pv">この画面では記録は保存されません。GitHub Pagesに置いたURLで開くと保存されます。</p>';
  paint(header + pv + `<div class="shelfhead"><nav class="tabs" role="tablist" aria-label="本の状態">${TABS.map(([k, l]) =>
    `<button type="button" role="tab" aria-selected="${ui.tab === k}" data-tab="${k}">${l}<span class="count">${counts[k]}</span></button>`).join('')}</nav>${tools}</div>` + body + bottom);

  // 選んでいるタブ・タグが横にはみ出ていたら見える位置までずらす
  for (const [box, on] of [['.tabs', '[aria-selected="true"]'], ['.chips', '[aria-pressed="true"]']]) {
    const c = app.querySelector(box), t = c && c.querySelector(on);
    if (t && (t.offsetLeft + t.offsetWidth > c.clientWidth || t.offsetLeft < c.scrollLeft)) c.scrollLeft = t.offsetLeft - 24;
  }
  app.querySelectorAll('[data-tab]').forEach(el => el.onclick = () => {
    ui.tab = el.dataset.tab;
    if (sel) ui.selected.clear();
    renderHome();
  });
  app.querySelectorAll('[data-tagf]').forEach(el => el.onclick = () => {
    ui.tagFilter = ui.tagFilter === el.dataset.tagf ? null : el.dataset.tagf;
    if (sel) ui.selected.clear();
    renderHome();
  });
  const sortBtn = document.getElementById('sortBtn');
  if (sortBtn) sortBtn.onclick = async () => {
    const k = await openMenu(sortBtn, '並び替え', SORTS, state.settings.sort);
    if (k && k !== state.settings.sort) { state.settings.sort = k; save(); }
    if (ui.page === 'home') { renderHome(); document.getElementById('sortBtn')?.focus(); }
  };
  const selBtn = document.getElementById('selBtn');
  if (selBtn) selBtn.onclick = () => {
    ui.selecting = true; ui.selected = new Set();
    pushLayer(() => { ui.selecting = false; ui.selected.clear(); if (ui.page === 'home') renderHome(); });
    renderHome();
  };
  app.querySelectorAll('[data-book]').forEach(el => el.onclick = () => {
    const b = state.books.find(x => x.id === el.dataset.book);
    if (!b) return;
    if (sel) {
      if (ui.selected.has(b.id)) ui.selected.delete(b.id); else ui.selected.add(b.id);
      renderHome();
      const again = app.querySelector(`[data-book="${CSS.escape(b.id)}"]`);
      if (again) again.focus();
      return;
    }
    if (b.status === 'done') openInfo(b); else openRecord(b);
  });
  app.querySelectorAll('[data-info]').forEach(el => el.onclick = () => {
    const b = state.books.find(x => x.id === el.dataset.info);
    if (b) openInfo(b);
  });
  if (sel) {
    app.querySelectorAll('[data-move]').forEach(el => el.onclick = () => {
      const k = el.dataset.move;
      const now = Date.now();
      let n = 0;
      state.books.forEach(b => {
        if (!ui.selected.has(b.id)) return;
        if (b.status !== k) {
          b.status = k; n++;
          if (k === 'want') b.wantAt = now;
          if (k === 'done') b.finishedAt = now;
        }
        b.updatedAt = now;
      });
      if (save()) toast(`${ui.selected.size}冊を「${STATUS[k]}」に移動しました`);
      popLayer();
    });
    document.getElementById('selDel').onclick = async () => {
      const n = ui.selected.size;
      if (!(await askConfirm(`選んだ${n}冊と、その記録をすべて削除しますか？`, '削除する', true))) return;
      state.books = state.books.filter(b => !ui.selected.has(b.id));
      if (save()) toast(`${n}冊を削除しました`);
      popLayer();
    };
    document.getElementById('selBack').onclick = () => popLayer();
  }
}

/* ========== 検索 ========== */
function renderSearch() {
  ui.page = 'search';

// 同じ言葉・同じページの検索結果は、アプリを開いている間は覚えておき、問い合わせを送らない
const kwCache = new Map();
async function runKeyword(more) {
  const k = ui.kw;
  if (!more) { k.items = []; k.idx = 1; k.hasMore = false; window.scrollTo(0, 0); }
  k.error = '';
  k.loading = true;
  const my = ++k.seq;
  drawKeywordResults();
  try {
    const key = [k.field, k.q, k.idx].join('\n');
    let res = kwCache.get(key);
    if (!res) {
      // 順番待ちの間に新しい検索をしたら、この問い合わせは送らない
      res = await ndlSearch({ [k.field === 'author' ? 'creator' : 'title']: k.q }, k.idx, 30, () => my !== k.seq);
      kwCache.set(key, res);
      if (kwCache.size > 30) kwCache.delete(kwCache.keys().next().value);
    }
    const { total, items } = res;
    if (my !== k.seq) return;
    const seen = new Set(k.items.map(x => x.isbn));
    items.forEach(x => { if (!seen.has(x.isbn)) { seen.add(x.isbn); k.items.push(x); } });
    k.idx += 30;
    k.hasMore = k.idx <= total;
  } catch (e) {
    if (my !== k.seq) return;
    k.error = navigator.onLine === false ? 'オフラインのため検索できません。通信できる場所でもう一度お試しください。'
      : e && e.status === 429 ? '国立国会図書館サーチが混み合っています。少し待ってからもう一度お試しください。'
      : e && e.name === 'AbortError' ? '国立国会図書館サーチからの返事が遅いため、検索をあきらめました。少し待ってからもう一度お試しください。'
      : '検索できませんでした。少し待ってからもう一度お試しください。';
  }
  k.searched = true;
  k.loading = false;
  drawKeywordResults();
}

/* ========== バーコード読み取り ========== */
function getDetector() {
  if (!detectorPromise) {
    detectorPromise = (async () => {
      // Androidのブラウザには読み取り機能が標準で入っていることが多いので、まずそれを使う
      if ('BarcodeDetector' in window) {
        try {
          const formats = await window.BarcodeDetector.getSupportedFormats();
          if (formats.includes('ean_13')) return new window.BarcodeDetector({ formats: ['ean_13'] });
        } catch {}
      }
      const mod = await import(PONYFILL_URL);
      return new mod.BarcodeDetector({ formats: ['ean_13'] });
    })().catch(e => { detectorPromise = null; throw e; });
  }
  return detectorPromise;
}
function cameraErrorText(e) {
  if (!window.isSecureContext) return 'カメラはHTTPSで公開したページでしか使えません。GitHub PagesのURLから開いてください。';
  const n = e && e.name;
  if (n === 'NotAllowedError' || n === 'SecurityError') return 'カメラの使用が許可されていません。アドレスバー左のアイコンからカメラを許可して、もう一度開いてください。';
  if (n === 'NotFoundError' || n === 'OverconstrainedError') return '使えるカメラが見つかりません。ISBNを入力して追加してください。';
  if (n === 'NotReadableError') return 'カメラを起動できませんでした。ほかのアプリがカメラを使っていないか確認してください。';
  return 'カメラを起動できませんでした。ISBNを入力して追加できます。';
}
function stopScanner() {
  scanSession++;
  if (scanner) {
    clearTimeout(scanner.timer);
    scanner.stream.getTracks().forEach(t => t.stop());
    scanner = null;
  }
}
async function startScanner() {
  stopScanner();
  const my = ++scanSession;
  const msg = document.getElementById('scanMsg');
  const video = document.getElementById('video');
  if (!navigator.mediaDevices?.getUserMedia) { msg.textContent = cameraErrorText(); return; }
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
    });
  } catch (e) {
    if (my === scanSession) msg.textContent = cameraErrorText(e);
    return;
  }
  if (my !== scanSession) { stream.getTracks().forEach(t => t.stop()); return; }
  scanner = { stream, timer: null };
  video.srcObject = stream;
  try { await video.play(); } catch {}
  try {
    const track = stream.getVideoTracks()[0];
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    if (caps.focusMode && caps.focusMode.includes('continuous')) await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
  } catch {}
  msg.textContent = '読み取りの準備をしています…';
  let detector;
  try { detector = await getDetector(); }
  catch {
    if (my === scanSession) msg.textContent = '読み取り機能を読み込めませんでした。通信状態を確認するか、ISBNを入力して追加してください。';
    return;
  }
  if (my !== scanSession) return;
  const guide = '978から始まる上段のバーコードを枠に合わせてください';
  msg.textContent = guide;
  let last = null, hits = 0, lowerTimer = null;
  const tick = async () => {
    if (my !== scanSession) return;
    if (video.readyState >= 2) {
      try {
        const codes = await detector.detect(video);
        if (my !== scanSession) return;
        let found = null, sawLower = false;
        for (const c of codes) {
          const v = String(c.rawValue || '').trim();
          if (isBookIsbn13(v)) { found = v; break; }
          if (/^19[12]\d{10}$/.test(v)) sawLower = true;
        }
        if (found) {
          // 読み間違いを防ぐため、同じ番号が2回続けて読めたら確定
          hits = found === last ? hits + 1 : 1;
          last = found;
          if (hits >= 2) { onScanned(found); return; }
        } else if (sawLower) {
          msg.textContent = 'それは下段のバーコードです。上段の978から始まる方を読み取ってください';
          clearTimeout(lowerTimer);
          lowerTimer = setTimeout(() => { if (my === scanSession) msg.textContent = guide; }, 2500);
        }
      } catch {}
    }
    if (scanner && my === scanSession) scanner.timer = setTimeout(tick, 120);
  };
  tick();
}
function onScanned(isbn) {
  if (navigator.vibrate) navigator.vibrate(60);
  stopScanner();
  navReplace('#/found?isbn=' + isbn);
}

/* ========== 記録（グラフ・カレンダー） ========== */
function buildDayMap() {
  const map = new Map();
  for (const b of state.books) for (const l of b.logs) {
    if (!l.pages) continue;
    let day = map.get(l.date);
    if (!day) { day = new Map(); map.set(l.date, day); }
    day.set(b.id, (day.get(b.id) || 0) + l.pages);
  }
  return map;
}
function niceScale(v) {
  v = Math.max(v, 10);
  const raw = v / 4;
  const mag = 10 ** Math.floor(Math.log10(raw));
  const n = raw / mag;
  const step = Math.max(1, (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * mag);
  return { max: Math.ceil(v / step) * step, step };
}
function dayPanelHtml(ds, pickBook, dm, emptyText) {

  const items = [...m.entries()].map(([id, p]) => ({ b: state.books.find(x => x.id === id), p })).filter(x => x.b).sort((a, b) => b.p - a.p);
  const total = items.reduce((s, x) => s + x.p, 0);
  return `<div class="daypanel" aria-live="polite"><p class="dayhead">${fmtLong(ds)}<span>合計${total}ページ</span></p>
    <ul class="daylist">${items.map(x => `<li class="${x.b.id === pickBook ? 'hl' : ''}"><i class="sw" style="background:${colorOf(x.b)}"></i>${coverHtml(x.b, 'xxs')}<span class="bt">${esc(x.b.title)}</span><span class="pg">${x.p}ページ</span></li>`).join('')}</ul></div>`;
}
function weekLabel(ws) {
  const we = addDays(ws, 6);
  const y = ws.getFullYear() !== new Date().getFullYear() ? `${ws.getFullYear()}年` : '';
  const right = we.getMonth() === ws.getMonth() ? `${we.getDate()}日` : `${we.getMonth() + 1}月${we.getDate()}日`;
  return `${y}${ws.getMonth() + 1}月${ws.getDate()}日〜${right}`;
}
function barHtml(dm) {
  const ws = parseLocal(ui.weekStart);
  const today = localDate();
  const books = [...state.books].sort((a, b) => a.createdAt - b.createdAt);
  const cols = [...Array(7)].map((_, i) => {
    const d = addDays(ws, i), ds = localDate(d), m = dm.get(ds);
    const segs = m ? books.filter(b => m.get(b.id)).map(b => ({ b, p: m.get(b.id) })) : [];
    return { d, ds, segs, total: segs.reduce((s, x) => s + x.p, 0) };
  });
  const weekTotal = cols.reduce((s, c) => s + c.total, 0);
  const W = 320, H = 330, L = 34, R = 6, T = 22, B = 46;
  const cw = (W - L - R) / 7, bw = Math.min(26, cw * 0.58), ph = H - T - B;
  const { max, step } = niceScale(Math.max(0, ...cols.map(c => c.total)));
  const y = v => T + ph - (v / max) * ph;
  const pick = ui.barPick;
  let g = '';
  for (let v = 0; v <= max; v += step) {
    const yy = y(v).toFixed(1);
    g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" class="grid${v === 0 ? ' base' : ''}"/><text x="${L - 6}" y="${(+yy + 4).toFixed(1)}" text-anchor="end">${v}</text>`;
  }
  cols.forEach((c, i) => {
    const cx = L + cw * i + cw / 2, x = cx - bw / 2;
    const isToday = c.ds === today;
    if (isToday) g += `<rect class="nowbg" x="${(L + cw * i + 2).toFixed(1)}" y="${H - B + 4}" width="${(cw - 4).toFixed(1)}" height="40" rx="8"/>`;
    g += `<rect class="hit" data-day="${c.ds}" x="${(L + cw * i).toFixed(1)}" y="${T}" width="${cw.toFixed(1)}" height="${ph + B}"/>`;
    let acc = 0;
    c.segs.forEach(s => {
      const y1 = y(acc + s.p), y0 = y(acc);
      let cls = 'segr';
      if (pick) {
        if (pick.book) cls += (pick.day === c.ds && pick.book === s.b.id) ? ' on' : ' dim';
        else if (pick.day !== c.ds) cls += ' dim';
      }
      g += `<rect class="${cls}" data-day="${c.ds}" data-book="${esc(s.b.id)}" x="${x.toFixed(1)}" y="${y1.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0, y0 - y1).toFixed(1)}" fill="${colorOf(s.b)}"/>`;
      acc += s.p;
    });
    if (c.total) g += `<text class="tot" x="${cx.toFixed(1)}" y="${(y(c.total) - 6).toFixed(1)}" text-anchor="middle">${c.total}</text>`;
    const wcls = i === 0 ? ' sun' : i === 6 ? ' sat' : '';
    g += `<text class="wdl${wcls}${isToday ? ' now' : ''}" x="${cx.toFixed(1)}" y="${H - B + 20}" text-anchor="middle">${WD[i]}</text>`;
    g += `<text class="dtl${isToday ? ' now' : ''}" x="${cx.toFixed(1)}" y="${H - B + 37}" text-anchor="middle">${c.d.getMonth() + 1}/${c.d.getDate()}</text>`;
  });
  const isCurrent = ui.weekStart >= localDate(startOfWeek(new Date()));
  return `
  <div class="weekhead"><p class="wlabel">${weekLabel(ws)}</p><p class="wtotal">合計<b>${weekTotal}</b>ページ</p></div>
  <div class="chartwrap">
    <button type="button" class="arrow" id="wPrev" aria-label="前の週">${ICON.prev}</button>
    <div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${weekLabel(ws)}の読んだページ数">${g}</svg></div>
    <button type="button" class="arrow" id="wNext" aria-label="次の週" ${isCurrent ? 'disabled' : ''}>${ICON.next}</button>
  </div>
  ${dayPanelHtml(pick && pick.day, pick && pick.book, dm, '棒をタップすると、その日に読んだ本がわかります。')}`;
}
function calHtml(dm) {
  const [yy, mm] = ui.month.split('-').map(Number);
  const first = new Date(yy, mm - 1, 1);
  const daysIn = new Date(yy, mm, 0).getDate();
  const today = localDate();
  let cells = WD.split('').map((w, i) => `<div class="wd${i === 0 ? ' sun' : i === 6 ? ' sat' : ''}">${w}</div>`).join('');
  for (let i = 0; i < first.getDay(); i++) cells += '<div class="cell blank" aria-hidden="true"></div>';
  let total = 0, readDays = 0;
  for (let day = 1; day <= daysIn; day++) {
    const d = new Date(yy, mm - 1, day), ds = localDate(d), m = dm.get(ds);
    const pages = m ? [...m.values()].reduce((s, v) => s + v, 0) : 0;
    if (pages) { total += pages; readDays++; }
    const wd = d.getDay();
    const cls = ['cell', wd === 0 ? 'sun' : wd === 6 ? 'sat' : '', ds === today ? 'today' : '', ds > today ? 'future' : '', ui.calPick === ds ? 'picked' : ''].filter(Boolean).join(' ');
    const r = (hashNum(ds) % 13) - 6;
    cells += `<button type="button" class="${cls}" data-cday="${ds}" ${ds > today ? 'disabled' : ''} aria-label="${mm}月${day}日 ${pages ? pages + 'ページ' : '記録なし'}">
      <span class="dn">${day}</span>${pages ? `<span class="mstamp" style="--r:${r}deg">${pages}</span>` : ''}</button>`;
  }
  const isCurrent = ui.month >= today.slice(0, 7);
  return `
  <div class="cal">
    <div class="calhead">
      <button type="button" class="arrow" id="mPrev" aria-label="前の月">${ICON.prev}</button>
      <button type="button" class="ymbtn" id="ymBtn" aria-expanded="${ui.ymOpen}" aria-controls="ymPanel" aria-label="${yy}年${mm}月（タップで年と月を選ぶ）">${yy}年${mm}月${ICON.down}</button>
      <button type="button" class="arrow" id="mNext" aria-label="次の月" ${isCurrent ? 'disabled' : ''}>${ICON.next}</button>
    </div>
    ${ui.ymOpen ? ymPanelHtml(yy, mm) : ''}
    <div class="calgrid">${cells}</div>
    <p class="msum">${readDays ? `${mm}月は<b>${readDays}</b>日読んで、合計<b>${total}</b>ページ` : `${mm}月の記録はまだありません`}</p>
  </div>
  ${dayPanelHtml(ui.calPick, null, dm, '日付をタップすると、その日に読んだ本がわかります。')}`;
}
// 年月を選ぶパネル（カレンダーの「2026年9月」を押すと下に開く）
function ymPanelHtml(selY, selM) {
  const today = localDate(), cy = Number(today.slice(0, 4)), cm = Number(today.slice(5, 7));
  const y = ui.ymYear;
  return `<div class="ympanel" id="ymPanel">
    <div class="ymyear">
      <button type="button" class="arrow" id="yPrev" aria-label="前の年">${ICON.prev}</button>
      <p aria-live="polite">${y}年</p>
      <button type="button" class="arrow" id="yNext" aria-label="次の年" ${y >= cy ? 'disabled' : ''}>${ICON.next}</button>

      const m = i + 1, future = y > cy || (y === cy && m > cm);
