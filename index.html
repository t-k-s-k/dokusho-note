    }).join('')}</div>
  </div>`;
}
function renderCal() {
  ui.page = 'cal';
  if (!ui.weekStart) ui.weekStart = localDate(startOfWeek(new Date()));
  if (!ui.month) ui.month = localDate().slice(0, 7);
  const dm = buildDayMap();
  const v = ui.statsView;
  paint(`<header class="pagehead"><h1>読書の記録</h1></header>
  <div class="viewseg" role="tablist" aria-label="表示の切り替え">
    <button type="button" role="tab" aria-selected="${v === 'bar'}" data-view="bar">${ICON.bars}<span>グラフ</span></button>
    <button type="button" role="tab" aria-selected="${v === 'cal'}" data-view="cal">${ICON.cal}<span>カレンダー</span></button>
  </div>` + (v === 'bar' ? barHtml(dm) : calHtml(dm)) + navHtml('cal'));
  app.querySelectorAll('[data-view]').forEach(el => el.onclick = () => { ui.statsView = el.dataset.view; ui.ymOpen = false; renderCal(); });
  if (v === 'bar') {
    document.getElementById('wPrev').onclick = () => { ui.weekStart = localDate(addDays(parseLocal(ui.weekStart), -7)); ui.barPick = null; renderCal(); };
    document.getElementById('wNext').onclick = () => { ui.weekStart = localDate(addDays(parseLocal(ui.weekStart), 7)); ui.barPick = null; renderCal(); };
    app.querySelectorAll('.chart [data-day]').forEach(el => el.addEventListener('click', e => {
      e.stopPropagation();
      const day = el.dataset.day, book = el.dataset.book || null;
      const p = ui.barPick;
      ui.barPick = (p && p.day === day && p.book === book) ? null : { day, book };
      renderCal();
    }));
  } else {
    const shift = n => { const d = parseLocal(ui.month + '-01'); d.setMonth(d.getMonth() + n); ui.month = localDate(d).slice(0, 7); ui.calPick = null; ui.ymOpen = false; renderCal(); };
    document.getElementById('mPrev').onclick = () => shift(-1);
    document.getElementById('mNext').onclick = () => shift(1);
    document.getElementById('ymBtn').onclick = () => {
      ui.ymOpen = !ui.ymOpen;
      ui.ymYear = Number(ui.month.slice(0, 4));
      renderCal();
      document.getElementById('ymBtn').focus();
    };
    if (ui.ymOpen) {
      const year = n => { ui.ymYear += n; renderCal(); document.getElementById(n < 0 ? 'yPrev' : 'yNext').focus(); };
      document.getElementById('yPrev').onclick = () => year(-1);
      document.getElementById('yNext').onclick = () => year(1);
      app.querySelectorAll('[data-ym]').forEach(el => el.onclick = () => {
        ui.month = el.dataset.ym; ui.calPick = null; ui.ymOpen = false;
        renderCal();
        document.getElementById('ymBtn').focus();
      });
    }
    app.querySelectorAll('[data-cday]').forEach(el => el.onclick = () => {
      ui.calPick = ui.calPick === el.dataset.cday ? null : el.dataset.cday;
      renderCal();
    });
  }
}

/* ========== 統計（年間・月間・通算） ========== */
// 月ごと・日ごと・年ごとの読んだページ数の棒グラフ
function colChart({ labels, tips, values, showLabel, cur, drill, aria }) {
  const W = 320, H = 200, L = 34, R = 6, T = 18, B = 24;
  const n = values.length, cw = (W - L - R) / n, bw = Math.max(3, Math.min(24, cw * 0.62)), ph = H - T - B;
  const { max, step } = niceScale(Math.max(0, ...values));
  const y = v => T + ph - (v / max) * ph;
  const short = v => (v >= 1000 ? (Math.round(v / 100) / 10) + 'k' : String(v));
  let g = '';
  for (let v = 0; v <= max; v += step) {
    const yy = y(v).toFixed(1);
    g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" class="grid${v === 0 ? ' base' : ''}"/><text x="${L - 6}" y="${(+yy + 4).toFixed(1)}" text-anchor="end">${v}</text>`;
  }
  values.forEach((v, i) => {
    const cx = L + cw * i + cw / 2;
    if (drill) g += `<rect class="hit" data-drill="${i}" x="${(L + cw * i).toFixed(1)}" y="${T}" width="${cw.toFixed(1)}" height="${ph + B}"><title>${esc((tips || labels)[i])}：${v}ページ</title></rect>`;
    if (v) g += `<rect class="colb" x="${(cx - bw / 2).toFixed(1)}" y="${y(v).toFixed(1)}" width="${bw.toFixed(1)}" height="${(T + ph - y(v)).toFixed(1)}" rx="2" ${drill ? `data-drill="${i}"` : ''}/>`;
    if (v && n <= 12) g += `<text class="vl" x="${cx.toFixed(1)}" y="${(y(v) - 5).toFixed(1)}" text-anchor="middle">${short(v)}</text>`;
    if (showLabel(i)) g += `<text class="${i === cur ? 'now' : ''}" x="${cx.toFixed(1)}" y="${H - 7}" text-anchor="middle">${esc(labels[i])}</text>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria)}">${g}</svg></div>`;
}
function earliestDate() {
  let e = '';
  const take = ds => { if (ds && (!e || ds < e)) e = ds; };
  state.books.forEach(b => {
    take(tsDate(b.createdAt));
    if (b.wantAt) take(tsDate(b.wantAt));
    if (b.finishedAt) take(tsDate(b.finishedAt));
    b.logs.forEach(l => take(l.date));
  });
  return e;
}
function coverGridHtml(key, title, books, sub) {
  const limit = 12, open = ui.statAll[key];
  const shown = open ? books : books.slice(0, limit);
  return `<div class="sechead"><h2>${title}</h2><span>${books.length}冊</span></div>` + (books.length
    ? `<ul class="covergrid">${shown.map(b => `<li><button type="button" class="cg" data-sbook="${esc(b.id)}" aria-label="「${esc(b.title)}」の情報">${coverHtml(b, 'fill')}<span class="cgt">${esc(b.title)}</span><span class="cgd">${sub(b)}</span></button></li>`).join('')}</ul>
      ${books.length > limit ? `<button type="button" class="btn morebtn" data-more="${key}">${open ? '閉じる' : `すべて表示（${books.length}冊）`}</button>` : ''}`
    : `<p class="none">この期間にはありません。</p>`);
}
function renderStats() {
  ui.page = 'stats';
  const today = localDate(), curY = Number(today.slice(0, 4)), curYM = today.slice(0, 7);
  if (!ui.statYear) ui.statYear = curY;
  if (!ui.statMonth) ui.statMonth = curYM;
  const p = ui.statPeriod;
  const plabel = PERIODS.find(([k]) => k === p)[1];
  const first = earliestDate() || today;
  let from, to, title, canPrev, canNext, unit;
  if (p === 'year') {
    from = `${ui.statYear}-01-01`; to = `${ui.statYear}-12-31`; title = `${ui.statYear}年`; unit = '年';
    canPrev = ui.statYear > Number(first.slice(0, 4)); canNext = ui.statYear < curY;
  } else if (p === 'month') {
    const [y, m] = ui.statMonth.split('-').map(Number);
    from = `${ui.statMonth}-01`; to = `${ui.statMonth}-31`; title = `${y}年${m}月`; unit = '月';
    canPrev = ui.statMonth > first.slice(0, 7); canNext = ui.statMonth < curYM;
  } else {
    from = '0000-00-00'; to = '9999-99-99';
    title = state.books.length ? `${fmtLong(first).replace(/（.）$/, '')}から今日まで` : 'まだ記録がありません';
  }
  const inR = ds => ds >= from && ds <= to;
  const wantBooks = state.books.filter(b => b.wantAt && inR(tsDate(b.wantAt))).sort((a, b) => b.wantAt - a.wantAt);
  const doneBooks = state.books.filter(b => b.status === 'done' && b.finishedAt && inR(tsDate(b.finishedAt))).sort((a, b) => b.finishedAt - a.finishedAt);
  const logs = [];
  state.books.forEach(b => b.logs.forEach(l => { if (l.pages && inR(l.date)) logs.push(l); }));
  const pages = logs.reduce((s, l) => s + l.pages, 0);
  const days = new Set(logs.map(l => l.date)).size;

  // グラフ：年間は月ごと、月間は日ごと、通算は年ごと。棒をタップすると、その月・その年に切り替わる
  let chart;
  if (p === 'year') {
    const values = Array(12).fill(0);
    logs.forEach(l => { values[Number(l.date.slice(5, 7)) - 1] += l.pages; });
    chart = { head: '月ごとの読んだページ数', values, labels: values.map((_, i) => String(i + 1)), tips: values.map((_, i) => `${i + 1}月`),
      showLabel: () => true, cur: ui.statYear === curY ? Number(today.slice(5, 7)) - 1 : -1,
      drill: i => { ui.statPeriod = 'month'; ui.statMonth = `${ui.statYear}-${pad2(i + 1)}`; } };
  } else if (p === 'month') {
    const [y, m] = ui.statMonth.split('-').map(Number);
    const values = Array(new Date(y, m, 0).getDate()).fill(0);
    logs.forEach(l => { values[Number(l.date.slice(8, 10)) - 1] += l.pages; });
    chart = { head: '日ごとの読んだページ数', values, labels: values.map((_, i) => String(i + 1)),
      showLabel: i => i === 0 || (i + 1) % 5 === 0, cur: ui.statMonth === curYM ? Number(today.slice(8, 10)) - 1 : -1, drill: null };
  } else {
    const y0 = Math.min(Number(first.slice(0, 4)), curY);
    const values = Array(curY - y0 + 1).fill(0);
    logs.forEach(l => { values[Number(l.date.slice(0, 4)) - y0] += l.pages; });
    chart = { head: '年ごとの読んだページ数', values, labels: values.map((_, i) => String(y0 + i)), tips: values.map((_, i) => `${y0 + i}年`), showLabel: () => true,
      cur: values.length - 1, drill: i => { ui.statPeriod = 'year'; ui.statYear = y0 + i; } };
  }
  const avg = days ? Math.round(pages / days) : 0;
  paint(`<header class="pagehead split"><h1>統計</h1>
    <button type="button" class="periodbtn" id="periodBtn" aria-haspopup="menu" aria-label="期間を切り替える（いまは${plabel}）">${plabel}${ICON.down}</button></header>
  <div class="periodnav">${p === 'all'
    ? `<span></span><p>${title}</p><span></span>`
    : `<button type="button" class="arrow" id="pPrev" aria-label="前の${unit}" ${canPrev ? '' : 'disabled'}>${ICON.prev}</button>
       <p aria-live="polite">${title}</p>
       <button type="button" class="arrow" id="pNext" aria-label="次の${unit}" ${canNext ? '' : 'disabled'}>${ICON.next}</button>`}</div>
  <div class="tiles">
    <div class="tile"><span class="tl">読みたいに追加</span><span class="tv">${wantBooks.length}<small>冊</small></span></div>
    <div class="tile"><span class="tl">読了</span><span class="tv">${doneBooks.length}<small>冊</small></span></div>
    <div class="tile wide"><span class="tl">読んだページ数</span><span class="tv">${pages.toLocaleString('ja-JP')}<small>ページ</small></span>
      <span class="ts">${days ? `${days}日読みました（読んだ日は平均${avg}ページ）` : 'この期間の記録はまだありません'}</span></div>
  </div>
  <div class="sechead"><h2>${chart.head}</h2>${chart.drill ? '<span>棒をタップで詳しく</span>' : ''}</div>
  <div class="chartbox">${colChart({ ...chart, aria: `${title}の${chart.head}` })}</div>
  ${coverGridHtml('done', '読了した本', doneBooks, b => fmtMD(tsDate(b.finishedAt)) + ' 読了')}
  ${coverGridHtml('want', '読みたいに追加した本', wantBooks, b => fmtMD(tsDate(b.wantAt)) + ' 追加')}` + navHtml('stats'));

  const periodBtn = document.getElementById('periodBtn');
  periodBtn.onclick = async () => {
    const k = await openMenu(periodBtn, '期間', PERIODS, ui.statPeriod);
    if (k && k !== ui.statPeriod) {
      // 見ていた年・月を引き継いで切り替える
      if (k === 'month' && ui.statPeriod === 'year') ui.statMonth = ui.statYear === curY ? curYM : `${ui.statYear}-12`;
      if (k === 'year' && ui.statPeriod === 'month') ui.statYear = Number(ui.statMonth.slice(0, 4));
      ui.statPeriod = k; ui.statAll = {};
    }
    if (ui.page === 'stats') { renderStats(); document.getElementById('periodBtn').focus(); }
  };
  const shift = n => {
    if (p === 'year') ui.statYear += n;
    else { const d = parseLocal(ui.statMonth + '-01'); d.setMonth(d.getMonth() + n); ui.statMonth = localDate(d).slice(0, 7); }
    ui.statAll = {};
    renderStats();
    const btn = document.getElementById(n < 0 ? 'pPrev' : 'pNext');
    if (btn && !btn.disabled) btn.focus();
  };
  const prev = document.getElementById('pPrev'), next = document.getElementById('pNext');
  if (prev) prev.onclick = () => shift(-1);
  if (next) next.onclick = () => shift(1);
  if (chart.drill) app.querySelectorAll('[data-drill]').forEach(el => el.addEventListener('click', () => {
    chart.drill(Number(el.dataset.drill));
    ui.statAll = {};
    window.scrollTo(0, 0);
    renderStats();
  }));
  app.querySelectorAll('[data-sbook]').forEach(el => el.onclick = () => {
    const b = state.books.find(x => x.id === el.dataset.sbook);
    if (b) openInfo(b);
  });
  app.querySelectorAll('[data-more]').forEach(el => el.onclick = () => {
    ui.statAll[el.dataset.more] = !ui.statAll[el.dataset.more];
    renderStats();
  });
}

/* ========== 設定（バックアップ・タグの管理） ========== */
function backupFile() {
  return new File([JSON.stringify(state, null, 2)], `dokusho-note-${localDate()}.json`, { type: 'application/json' });
}
function markExported() {
  state.settings.lastExport = Date.now();
  save();
  if (ui.page === 'settings') renderSettings();
}
function renameTag(old) {
  openModal((m, ctx) => {
    m.innerHTML = `<p class="mtitle" id="mTitle">タグ「${esc(old)}」の名前を変える</p>
      <form id="rnForm" novalidate>
        <label class="field"><span>新しい名前</span><input name="t" value="${esc(old)}" maxlength="30" autocomplete="off"></label>
        <p class="err" id="rnErr" role="alert"></p>
        <div class="mbtns"><button type="button" class="btn" id="mCancel">キャンセル</button><button class="btn primary">変更する</button></div>
      </form>`;
    const form = m.querySelector('#rnForm');
    m.querySelector('#mCancel').onclick = () => popLayer();
    onSubmit(form, () => {
      const t = form.elements.t.value.trim().slice(0, 30);
      if (!t) { m.querySelector('#rnErr').textContent = '名前を入力してください。'; form.elements.t.focus(); return; }
      if (t !== old) {
        // 同じ名前のタグがすでにある本は、ひとつにまとめる
        state.books.forEach(b => {
          const i = b.tags.indexOf(old);
          if (i < 0) return;
          if (b.tags.includes(t)) b.tags.splice(i, 1); else b.tags[i] = t;
        });
        if (ui.tagFilter === old) ui.tagFilter = t;
        if (!save()) return;
        ctx.changed = true;
        toast(`タグを「${t}」に変えました`);
      }
      popLayer();
    });
    setTimeout(() => { form.elements.t.focus(); form.elements.t.select(); }, 50);
  });
}
function renderSettings() {
  ui.page = 'settings';
  const nb = state.books.length;
  const nl = state.books.reduce((s, b) => s + b.logs.length, 0);
  const tags = allTags();
  const le = state.settings.lastExport;
  let canShare = false;
  try { canShare = !!(navigator.canShare && navigator.canShare({ files: [backupFile()] })); } catch {}
  paint(`<header class="pagehead"><h1>設定</h1></header>
  <h2 class="sech">バックアップ</h2>
  <section class="card prose">
    <p>記録はこの端末のブラウザの中だけに保存されています。ブラウザのデータを消したり、スマホを買い替えたりすると記録も消えるので、ときどきファイルに書き出しておいてください。</p>
    <p class="help">いまのデータ：本${nb}冊、記録${nl}件<br>最後に書き出した日：${le ? fmtLong(tsDate(le)) : 'まだ書き出していません'}</p>
    <button type="button" class="btn primary block" id="exportBtn">${ICON.download}ファイルに書き出す</button>
    ${canShare ? `<button type="button" class="btn block" id="shareBtn">${ICON.upload}ほかのアプリに保存する</button>` : ''}
    <label class="btn block filebtn">ファイルから読み込む<input type="file" id="importFile" accept="application/json,.json" hidden></label>
    <p class="help">${canShare ? '「ほかのアプリに保存する」では、iCloud Drive や Google ドライブなどに保存できます。' : ''}読み込むと、いまのデータはファイルの内容に置き換わります。</p>
  </section>
  <h2 class="sech">タグ</h2>
  <section class="card">
    ${tags.length ? `<ul class="taglist">${tags.map(([t, n]) => `<li><span class="tn">${esc(t)}</span><span class="tc">${n}冊</span>
      <button type="button" class="minibtn" data-rename="${esc(t)}">名前を変更</button><button type="button" class="minibtn danger" data-deltag="${esc(t)}">削除</button></li>`).join('')}</ul>`
      : '<p class="help" style="margin:0">まだタグはありません。ホームで本の右にある ⓘ を開くと、タグを付けられます。</p>'}
  </section>
  <h2 class="sech">このアプリについて</h2>
  <section class="card prose">
    <p class="help" style="margin:0"><b>本の情報の出典</b><br>このアプリで検索・表示する本の情報（書誌データ）は、<a href="https://ndlsearch.ndl.go.jp/" target="_blank" rel="noopener">国立国会図書館サーチ</a>のAPIから取得した、国立国会図書館の「国立国会図書館蔵書」「国立国会図書館新着書誌情報」に由来します。ライセンスは<a href="https://creativecommons.org/licenses/by/4.0/deed.ja" target="_blank" rel="noopener">クリエイティブ・コモンズ 表示 4.0 国際 パブリック・ライセンス（CC BY 4.0）</a>です。</p>
    <p class="help">見やすくするため、タイトルや著者名の書き方を一部変えています（例：「村上, 春樹, 1949-」→「村上春樹」、「書名. 巻名」→「書名 巻名」）。</p>
    <p class="help">表紙は画像を使わず、本ごとの色にタイトルを書いたものを表示しています。</p>
  </section>` + navHtml('settings'));

  document.getElementById('exportBtn').onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(backupFile());
    a.download = `dokusho-note-${localDate()}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast('書き出しました');
    markExported();
  };
  const shareBtn = document.getElementById('shareBtn');
  if (shareBtn) shareBtn.onclick = async () => {
    try {
      await navigator.share({ files: [backupFile()], title: '読書ノートのバックアップ' });
      toast('保存しました');
      markExported();
    } catch (e) {
      if (!e || e.name !== 'AbortError') toast('保存できませんでした。「ファイルに書き出す」をお試しください');
    }
  };
  document.getElementById('importFile').onchange = async e => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const d = normalizeState(JSON.parse(await file.text()));
      if (await askConfirm(`いまのデータ（本${nb}冊）を、ファイルの内容（本${d.books.length}冊）に置き換えますか？`, '置き換える', true)) {
        state = d;
        ensureColors();
        ui.tagFilter = null;
        if (save()) { toast('読み込みました'); renderSettings(); backfillStarted = false; backfillMeta(); }
      }
    } catch {
      toast('読み込めませんでした。このアプリで書き出したファイルか確認してください');
    }
    e.target.value = '';
  };
  app.querySelectorAll('[data-rename]').forEach(el => el.onclick = () => renameTag(el.dataset.rename));
  app.querySelectorAll('[data-deltag]').forEach(el => el.onclick = async () => {
    const t = el.dataset.deltag;
    const n = state.books.filter(b => b.tags.includes(t)).length;
    if (!(await askConfirm(`タグ「${t}」を削除しますか？（${n}冊の本からこのタグが外れます。本は削除されません）`, '削除する', true))) return;
    state.books.forEach(b => { b.tags = b.tags.filter(x => x !== t); });
    if (ui.tagFilter === t) ui.tagFilter = null;
    if (save()) { toast(`タグ「${t}」を削除しました`); renderSettings(); }
  });
}

/* ========== 起動 ========== */
document.addEventListener('visibilitychange', () => {
  // アプリを離れたらカメラを止め、戻ってきたら再開する
  if (document.hidden) stopScanner();
  else if (ui.page === 'scan' && !scanner) renderScan();
});
window.addEventListener('error', e => toast('エラーが起きました：' + (e.message || '原因不明')));
window.addEventListener('unhandledrejection', e => toast('エラーが起きました：' + ((e.reason && e.reason.message) || '原因不明')));
try { if (storageOK && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch {}
ui.hash = (history.state && history.state.h) || location.hash || '#/';
histCall('replaceState', { d: curDepth(), h: ui.hash }, ui.hash);
save();
try { route(); }
catch (e) { app.innerHTML = `<section class="pad"><p class="h1">起動できませんでした</p><p class="help">${esc(e && e.message)}</p></section>`; }
setTimeout(() => backfillMeta().catch(() => {}), 60000); // 起動直後の検索とぶつからないよう1分待つ
</script>
</body>
</html>
